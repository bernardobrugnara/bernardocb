    function b64ToUint8(b64) {
      const bin = atob(b64);
      const arr = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
      return arr;
    }

    async function decrypt(password) {
      const encoder = new TextEncoder();
      const salt = b64ToUint8(ENC.salt);
      const iv = b64ToUint8(ENC.iv);
      const tag = b64ToUint8(ENC.tag);
      const ciphertext = b64ToUint8(ENC.data);

      // Combine ciphertext + auth tag (WebCrypto expects them concatenated)
      const combined = new Uint8Array(ciphertext.length + tag.length);
      combined.set(ciphertext);
      combined.set(tag, ciphertext.length);

      const keyMaterial = await crypto.subtle.importKey('raw', encoder.encode(password), 'PBKDF2', false, ['deriveKey']);
      const key = await crypto.subtle.deriveKey(
        { name: 'PBKDF2', salt, iterations: 100000, hash: 'SHA-256' },
        keyMaterial,
        { name: 'AES-GCM', length: 256 },
        false,
        ['decrypt']
      );

      const decrypted = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, combined);
      return new TextDecoder().decode(decrypted);
    }

    document.getElementById('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const pwd = document.getElementById('pwd').value;
      if (!pwd) return;

      document.getElementById('err').style.display = 'none';
      document.getElementById('loading').style.display = 'block';

      try {
        const html = await decrypt(pwd);
        document.open();
        document.write(html);
        document.close();
      } catch {
        document.getElementById('loading').style.display = 'none';
        document.getElementById('err').style.display = 'block';
        document.getElementById('pwd').value = '';
        document.getElementById('pwd').focus();
      }
    });
  </script>
