<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Page not found · bernardocb.com</title>
    <script>
      // SPA fallback for the Outcomes Factory app (single-page app under /outcomes-factory/).
      // GitHub Pages serves THIS root 404.html for any unknown path on bernardocb.com.
      // If the missing path is under /outcomes-factory/, encode it into a query string
      // and bounce to that app's index.html; the boot snippet there restores the real
      // URL via history.replaceState. Other projects fall through to the body's 404 UI.
      (function () {
        var l = window.location;
        var segs = l.pathname.split('/');
        if (segs[1] === 'outcomes-factory') {
          var pathSegmentsToKeep = 1;
          l.replace(
            l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
            l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
            l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
            (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
            l.hash
          );
        }
      })();
    </script>
    <style>
      body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; background: #fafafa; color: #18181b; margin: 0; }
      .wrap { max-width: 420px; margin: 18vh auto; padding: 0 24px; text-align: center; }
      h1 { font-size: 80px; font-weight: 200; margin: 0 0 8px; letter-spacing: -2px; color: #71717a; }
      p { color: #52525b; font-size: 15px; line-height: 1.5; margin: 0 0 20px; }
      a { color: #18181b; font-weight: 600; text-decoration: none; border-bottom: 2px solid #84cc16; padding-bottom: 1px; }
      a:hover { color: #65a30d; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>404</h1>
      <p>That page doesn't exist on bernardocb.com.</p>
      <p><a href="/">Go home</a></p>
    </div>
  </body>
</html>
