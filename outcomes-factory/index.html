<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Outcomes Factory · MVP</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <style>
      body { font-family: 'Figtree', system-ui, sans-serif; }
      .font-mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }
    </style>
    <script type="module" crossorigin src="/outcomes-factory/assets/index-BoUzXz8O.js"></script>
    <link rel="stylesheet" crossorigin href="/outcomes-factory/assets/index-Dtf1JJtD.css">
  </head>
  <body class="bg-zinc-50 text-zinc-900 antialiased">
    <div id="app" x-data="appView()" x-init="init()" x-cloak>

      <!-- AUTH GATE -->
      <template x-if="!session">
        <div class="min-h-screen flex items-center justify-center">
          <form @submit.prevent="login()" class="w-80 space-y-3 p-6 bg-white rounded-xl shadow border border-zinc-200">
            <h1 class="text-lg font-semibold tracking-tight">Outcomes Factory</h1>
            <input x-model="email" type="email" placeholder="Email" required
                   class="w-full border border-zinc-300 rounded-md px-3 py-2 text-[13px]" />
            <input x-model="password" type="password" placeholder="Password" required
                   class="w-full border border-zinc-300 rounded-md px-3 py-2 text-[13px]" />
            <button class="w-full bg-zinc-900 text-white py-2 rounded-md text-[13px] font-medium hover:bg-zinc-800">Sign in</button>
            <p x-show="authError" x-text="authError" class="text-[12px] text-red-600"></p>
          </form>
        </div>
      </template>

      <!-- APP SHELL -->
      <template x-if="session">
        <div class="flex flex-col h-screen overflow-hidden">

          <!-- TOPBAR -->
          <header class="h-12 flex-none bg-white flex items-center pr-5 border-b border-zinc-200">
            <div :class="sidebarCollapsed ? 'w-[64px] px-3 justify-center' : 'w-[230px] px-5'"
                 class="flex-none h-full flex items-center gap-2.5 transition-[width,padding] duration-150">
              <div class="w-7 h-7 rounded-lg bg-zinc-950 flex items-center justify-center flex-none shadow-sm">
                <i data-lucide="factory" class="w-4 h-4 text-[#d4ed4a]"></i>
              </div>
              <div x-show="!sidebarCollapsed" class="leading-tight min-w-0">
                <div class="text-[14px] font-semibold text-zinc-900 tracking-tight whitespace-nowrap">Teya Outcomes Factory</div>
                <div class="text-[10px] text-zinc-500 -mt-0.5">v0.1 · mvp</div>
              </div>
            </div>
            <div class="ml-auto flex items-center gap-3">
              <div class="relative">
                <i data-lucide="search" class="w-3.5 h-3.5 text-zinc-400 absolute left-2.5 top-1/2 -translate-y-1/2"></i>
                <input type="text" placeholder="Search anything (wip)"
                       class="pl-7 pr-14 py-1.5 w-72 text-[12px] rounded-md bg-zinc-50 border border-zinc-200 focus:outline-none focus:ring-2 focus:ring-lime-300 focus:border-lime-300 placeholder:text-zinc-400" />
                <kbd class="absolute right-2 top-1/2 -translate-y-1/2 pointer-events-none text-[10px] font-mono text-zinc-400 bg-white border border-zinc-200 rounded px-1.5 py-0.5 leading-none">/</kbd>
              </div>
              <button class="flex items-center gap-1.5 pl-2 pr-1.5 py-1 text-[12px] font-medium rounded-md border bg-white text-zinc-700 border-zinc-200 hover:bg-zinc-50">
                <i data-lucide="sparkles" class="w-3.5 h-3.5"></i>
                <span>Chat with AI</span>
                <kbd class="text-[10px] font-mono border rounded px-1.5 py-0.5 leading-none bg-zinc-50 border-zinc-200 text-zinc-400">⌘K</kbd>
              </button>
            </div>
          </header>

          <!-- SIDEBAR + MAIN -->
          <div class="flex-1 flex overflow-hidden min-h-0">

            <!-- SIDEBAR -->
            <aside :class="sidebarCollapsed ? 'w-[64px]' : 'w-[230px]'"
                   @mouseenter="if (!sidebarPinned) { sidebarCollapsed = false; refreshIcons(); }"
                   @mouseleave="if (!sidebarPinned) { sidebarCollapsed = true; refreshIcons(); }"
                   class="flex-none bg-white border-r border-zinc-200 flex flex-col transition-[width] duration-150">
              <div :class="sidebarCollapsed ? 'px-2' : 'px-3'" class="pt-4 pb-2 flex flex-col gap-4">
                <template x-for="(group, gIdx) in navGroups()" :key="group.name">
                  <div :class="group.name === 'Team' ? 'pt-4 mt-1 border-t border-zinc-200' : ''">
                    <div class="flex items-center justify-between px-2 mb-1.5 h-[14px]">
                      <div x-show="!sidebarCollapsed" class="text-[10px] uppercase tracking-wider text-zinc-400 font-semibold" x-text="group.name"></div>
                      <template x-if="gIdx === 0">
                        <button @click="sidebarPinned = !sidebarPinned; if (sidebarPinned) sidebarCollapsed = false; refreshIcons()"
                                :title="sidebarPinned ? 'Unpin sidebar (auto-collapse on mouse leave)' : 'Pin sidebar open'"
                                :class="[sidebarCollapsed ? 'mx-auto' : '', sidebarPinned ? 'text-zinc-700 bg-zinc-100' : 'text-zinc-400 hover:text-zinc-700']"
                                class="p-1 -mr-1 rounded hover:bg-zinc-100 flex-none">
                          <i x-show="!sidebarPinned" data-lucide="pin" class="w-3 h-3"></i>
                          <i x-show="sidebarPinned" data-lucide="pin-off" class="w-3 h-3"></i>
                        </button>
                      </template>
                    </div>
                    <nav class="flex flex-col gap-0.5">
                      <template x-for="item in group.items" :key="item.id">
                        <button @click="goto(item.id)"
                                :title="sidebarCollapsed ? item.label : ''"
                                :class="[
                                  currentModule === item.id ? 'bg-zinc-100 text-zinc-900' : 'text-zinc-600 hover:bg-zinc-50 hover:text-zinc-900',
                                  sidebarCollapsed ? 'justify-center px-0' : 'px-2.5'
                                ]"
                                class="nav-item w-full flex items-center gap-2.5 py-2 rounded-lg text-[13px] font-medium text-left">
                          <i :data-lucide="item.icon" class="w-4 h-4 flex-none"></i>
                          <span x-show="!sidebarCollapsed" x-text="item.label"></span>
                          <span x-show="!sidebarCollapsed && item.wip" class="text-[9px] font-mono text-zinc-400 uppercase">wip</span>
                          <span x-show="!sidebarCollapsed && item.id === 'roadmap'" class="ml-auto text-[10px] font-mono text-zinc-400" x-text="initiatives.length"></span>
                          <span x-show="!sidebarCollapsed && item.id === 'people'" class="ml-auto text-[10px] font-mono text-zinc-400" x-text="people.length"></span>
                        </button>
                      </template>
                    </nav>
                  </div>
                </template>
              </div>

              <div :class="sidebarCollapsed ? 'px-2' : 'px-3'" class="mt-auto pb-3">
                <div :class="sidebarCollapsed ? 'flex-col gap-1.5 px-0' : 'gap-2 px-1.5'" class="flex items-center py-1">
                  <div class="w-7 h-7 rounded-full bg-zinc-900 text-white text-[10px] flex items-center justify-center font-semibold flex-none">
                    <span x-text="(session?.user?.email || '?').slice(0,2).toUpperCase()"></span>
                  </div>
                  <div x-show="!sidebarCollapsed" class="leading-tight min-w-0 flex-1">
                    <div class="text-[12px] font-semibold text-zinc-900 truncate" x-text="session?.user?.email"></div>
                    <div class="text-[10px] text-zinc-500">Signed in</div>
                  </div>
                  <button @click="logout()"
                          title="Sign out"
                          :class="sidebarCollapsed ? '' : 'flex-none'"
                          class="p-1.5 rounded-md text-zinc-400 hover:text-zinc-900 hover:bg-zinc-100 transition">
                    <i data-lucide="log-out" class="w-3.5 h-3.5"></i>
                  </button>
                </div>
              </div>
            </aside>

            <!-- MAIN -->
            <main class="flex-1 overflow-hidden bg-zinc-50">

              <!-- ============================================ ROADMAP MODULE ============================================ -->
              <section x-show="currentModule === 'roadmap'" class="h-full flex flex-col">

                <!-- header -->
                <div class="flex-none border-b border-zinc-200 bg-white px-5 pt-3.5 pb-3.5 flex items-center justify-between">
                  <div>
                    <h1 class="text-[18px] font-semibold tracking-tight">Roadmap</h1>
                    <p class="text-[12px] text-zinc-500">Initiatives in flight across product groups. Switch between list, kanban and gantt.</p>
                  </div>
                  <div class="flex items-center gap-2">
                    <button @click="newInitiative()"
                            class="text-[12px] font-semibold bg-lime-400 hover:bg-lime-500 text-zinc-900 px-3 py-1.5 rounded-md flex items-center gap-1.5">
                      <i data-lucide="plus" class="w-3.5 h-3.5"></i>
                      New initiative
                    </button>
                  </div>
                </div>

                <!-- toolbar -->
                <div class="flex-none bg-white border-b border-zinc-200 px-5 py-2.5 flex items-center gap-2 flex-wrap">
                  <div class="flex items-center border border-zinc-200 rounded-md overflow-hidden">
                    <template x-for="v in [
                      { key: 'lanes',    icon: 'rows-3',               label: 'Lanes'     },
                      { key: 'endMonth', icon: 'calendar-check',       label: 'End month' },
                      { key: 'gantt',    icon: 'bar-chart-horizontal', label: 'Gantt'     },
                      { key: 'kanban',   icon: 'kanban-square',        label: 'Kanban'    },
                      { key: 'list',     icon: 'list',                 label: 'List'      },
                    ]" :key="v.key">
                      <button @click="roadmapView = v.key; refreshIcons()"
                              :class="roadmapView === v.key ? 'bg-zinc-100 text-zinc-900' : 'text-zinc-500 hover:bg-zinc-50'"
                              class="px-2.5 py-1.5 text-[12px] font-medium flex items-center gap-1.5 border-r border-zinc-200 last:border-r-0">
                        <i :data-lucide="v.icon" class="w-3.5 h-3.5"></i>
                        <span x-text="v.label"></span>
                      </button>
                    </template>
                  </div>

                  <div class="h-5 w-px bg-zinc-200 mx-1"></div>

                  <!-- filter -->
                  <div class="relative">
                    <button @click="roadmapFiltersOpen = !roadmapFiltersOpen; roadmapHideFieldsOpen = false; refreshIcons()"
                            :class="roadmapFiltersOpen || activeRoadmapFilterCount() ? 'bg-zinc-100 text-zinc-900' : 'text-zinc-600 hover:bg-zinc-50'"
                            class="px-2.5 py-1.5 rounded-md border border-zinc-200 text-[12px] font-medium flex items-center gap-1.5">
                      <i data-lucide="filter" class="w-3.5 h-3.5"></i>
                      <span>Filter</span>
                      <span x-show="activeRoadmapFilterCount() > 0"
                            class="text-[10px] font-mono font-semibold bg-lime-400 text-zinc-900 px-1 rounded"
                            x-text="activeRoadmapFilterCount()"></span>
                    </button>
                    <div x-show="roadmapFiltersOpen" @click.outside="roadmapFiltersOpen = false"
                         x-transition.opacity
                         class="absolute z-30 mt-1 left-0 w-72 bg-white border border-zinc-200 rounded-lg shadow-xl p-3 space-y-2.5">
                      <div>
                        <label class="text-[10.5px] uppercase tracking-wider font-semibold text-zinc-500 block mb-1">Initiative status</label>
                        <select x-model="roadmapFilters.initiativeStatus" class="w-full text-[12px] px-2 py-1.5 rounded-md border border-zinc-200 bg-white">
                          <option value="all">All (incl. archived &amp; deleted)</option>
                          <template x-for="s in INITIATIVE_STATUSES" :key="s.key">
                            <option :value="s.key" x-text="s.label"></option>
                          </template>
                        </select>
                      </div>
                      <div>
                        <label class="text-[10.5px] uppercase tracking-wider font-semibold text-zinc-500 block mb-1">Development stage</label>
                        <select x-model="roadmapFilters.developmentStage" class="w-full text-[12px] px-2 py-1.5 rounded-md border border-zinc-200 bg-white">
                          <option value="all">All stages</option>
                          <template x-for="s in INITIATIVE_DEVELOPMENT_STAGES" :key="s.key">
                            <option :value="s.key" x-text="s.label"></option>
                          </template>
                        </select>
                      </div>
                      <div>
                        <label class="text-[10.5px] uppercase tracking-wider font-semibold text-zinc-500 block mb-1">Delivery status</label>
                        <select x-model="roadmapFilters.deliveryStatus" class="w-full text-[12px] px-2 py-1.5 rounded-md border border-zinc-200 bg-white">
                          <option value="all">All</option>
                          <template x-for="d in INITIATIVE_DELIVERY_STATUSES" :key="d.key">
                            <option :value="d.key" x-text="d.label"></option>
                          </template>
                        </select>
                      </div>
                      <div>
                        <label class="text-[10.5px] uppercase tracking-wider font-semibold text-zinc-500 block mb-1">Product group</label>
                        <select x-model="roadmapFilters.productGroup" class="w-full text-[12px] px-2 py-1.5 rounded-md border border-zinc-200 bg-white">
                          <option value="all">All groups</option>
                          <template x-for="g in INITIATIVE_PRODUCT_GROUPS" :key="g.key">
                            <option :value="g.key" x-text="g.label"></option>
                          </template>
                        </select>
                      </div>
                      <div>
                        <label class="text-[10.5px] uppercase tracking-wider font-semibold text-zinc-500 block mb-1">Priority</label>
                        <select x-model="roadmapFilters.priority" class="w-full text-[12px] px-2 py-1.5 rounded-md border border-zinc-200 bg-white">
                          <option value="all">All priorities</option>
                          <template x-for="p in INITIATIVE_PRIORITIES" :key="p.key">
                            <option :value="p.key" x-text="p.label"></option>
                          </template>
                        </select>
                      </div>
                      <div>
                        <label class="text-[10.5px] uppercase tracking-wider font-semibold text-zinc-500 block mb-1">Country</label>
                        <select x-model="roadmapFilters.country" class="w-full text-[12px] px-2 py-1.5 rounded-md border border-zinc-200 bg-white">
                          <option value="all">All countries</option>
                          <template x-for="c in INITIATIVE_COUNTRIES" :key="c.code">
                            <option :value="c.code" x-text="`${c.flag} ${c.label}`"></option>
                          </template>
                        </select>
                      </div>
                      <div>
                        <label class="text-[10.5px] uppercase tracking-wider font-semibold text-zinc-500 block mb-1">DRI</label>
                        <select x-model="roadmapFilters.dri" class="w-full text-[12px] px-2 py-1.5 rounded-md border border-zinc-200 bg-white">
                          <option value="all">All DRIs</option>
                          <template x-for="p in people" :key="p.id">
                            <option :value="p.id" x-text="p.name"></option>
                          </template>
                        </select>
                      </div>
                      <div>
                        <label class="text-[10.5px] uppercase tracking-wider font-semibold text-zinc-500 block mb-1">IMO</label>
                        <select x-model="roadmapFilters.imo" class="w-full text-[12px] px-2 py-1.5 rounded-md border border-zinc-200 bg-white">
                          <option value="all">All IMOs</option>
                          <template x-for="i in INITIATIVE_IMOS" :key="i.key">
                            <option :value="i.key" x-text="`${i.code} ${i.label}`"></option>
                          </template>
                        </select>
                      </div>
                      <div class="flex items-center justify-between pt-1 border-t border-zinc-100">
                        <button @click="resetRoadmapFilters()" class="text-[11px] text-zinc-500 hover:text-zinc-900">Reset filters</button>
                        <button @click="roadmapFiltersOpen = false" class="text-[11px] text-zinc-900 font-medium">Done</button>
                      </div>
                    </div>
                  </div>

                  <!-- group by (hidden in lanes) -->
                  <div x-show="roadmapView !== 'lanes'" class="relative">
                    <button @click="roadmapGroupByOpen = !roadmapGroupByOpen; roadmapFiltersOpen = false; roadmapHideFieldsOpen = false; refreshIcons()"
                            :class="roadmapGroupByOpen || roadmapGroupConfig.length ? 'bg-zinc-100 text-zinc-900' : 'text-zinc-600 hover:bg-zinc-50'"
                            class="px-2.5 py-1.5 rounded-md border border-zinc-200 text-[12px] font-medium flex items-center gap-1.5">
                      <i data-lucide="layers" class="w-3.5 h-3.5"></i>
                      <span>Group</span>
                      <span x-show="roadmapGroupConfig.length > 0"
                            class="text-[10px] font-mono font-semibold bg-lime-400 text-zinc-900 px-1 rounded"
                            x-text="roadmapGroupConfig.length"></span>
                    </button>
                    <div x-show="roadmapGroupByOpen" @click.outside="roadmapGroupByOpen = false"
                         x-transition.opacity
                         class="absolute z-30 mt-1 left-0 w-[420px] bg-white border border-zinc-200 rounded-lg shadow-xl p-3">
                      <div class="flex items-center gap-1.5 mb-3 pb-2.5 border-b border-zinc-100">
                        <span class="text-[12.5px] font-semibold text-zinc-700">Group by</span>
                      </div>
                      <div class="space-y-1.5">
                        <template x-for="(cfg, idx) in roadmapGroupConfig" :key="`grp-row-${idx}`">
                          <div class="flex items-center gap-1.5">
                            <div class="relative flex-1 flex items-center gap-1.5 px-2.5 py-1.5 rounded-md border border-zinc-200 bg-white hover:border-zinc-300">
                              <i :data-lucide="fieldIcon(cfg.field)" class="w-3.5 h-3.5 text-zinc-500 flex-none"></i>
                              <span class="text-[12.5px] text-zinc-900 flex-1 truncate" x-text="roadmapGroupOptionLabel(cfg.field)"></span>
                              <i data-lucide="chevron-down" class="w-3.5 h-3.5 text-zinc-400 flex-none"></i>
                              <select x-model="cfg.field" @change="refreshIcons()" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer">
                                <template x-for="opt in roadmapGroupOptions" :key="opt.value">
                                  <option :value="opt.value"
                                          :disabled="usedRoadmapGroupFieldsExcept(idx).includes(opt.value)"
                                          x-text="opt.label"></option>
                                </template>
                              </select>
                            </div>
                            <div class="relative flex items-center gap-1.5 px-2.5 py-1.5 rounded-md border border-zinc-200 bg-white" style="width:90px;">
                              <span class="text-[12.5px] text-zinc-900 flex-1 font-mono" x-text="cfg.dir === 'desc' ? 'Z → A' : 'A → Z'"></span>
                              <i data-lucide="chevron-down" class="w-3.5 h-3.5 text-zinc-400 flex-none"></i>
                              <select x-model="cfg.dir" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer">
                                <option value="asc">A → Z</option>
                                <option value="desc">Z → A</option>
                              </select>
                            </div>
                            <button @click="roadmapGroupConfig.splice(idx, 1); refreshIcons()"
                                    title="Remove group"
                                    class="p-1.5 rounded text-zinc-400 hover:text-red-600 hover:bg-red-50">
                              <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                            </button>
                          </div>
                        </template>
                      </div>
                      <button @click="addRoadmapGroup()"
                              :disabled="roadmapGroupConfig.length >= roadmapGroupOptions.length"
                              :class="roadmapGroupConfig.length >= roadmapGroupOptions.length ? 'opacity-40 cursor-not-allowed' : 'hover:bg-zinc-50 cursor-pointer text-zinc-700'"
                              class="mt-2 w-full text-left flex items-center gap-2 px-2 py-1.5 rounded text-[12.5px] text-zinc-600">
                        <i data-lucide="plus" class="w-3.5 h-3.5"></i>
                        <span x-text="roadmapGroupConfig.length === 0 ? 'Add group' : 'Add subgroup'"></span>
                      </button>
                    </div>
                  </div>

                  <!-- sort (hidden in lanes) -->
                  <div x-show="roadmapView !== 'lanes'" class="flex items-center gap-1.5">
                    <label class="text-[11px] text-zinc-500 flex items-center gap-1.5">
                      <i data-lucide="arrow-up-down" class="w-3.5 h-3.5"></i>
                      Sort
                    </label>
                    <select x-model="roadmapSortBy" class="text-[12px] px-2 py-1.5 rounded-md border border-zinc-200 bg-white">
                      <option value="startDate-asc">Start date · ↑</option>
                      <option value="startDate-desc">Start date · ↓</option>
                      <option value="endDate-asc">End date · ↑</option>
                      <option value="endDate-desc">End date · ↓</option>
                      <option value="priority-asc">Priority · P1 → P3</option>
                      <option value="priority-desc">Priority · P3 → P1</option>
                      <option value="developmentStage-asc">Dev stage · early → shipped</option>
                      <option value="name-asc">Name · A → Z</option>
                      <option value="name-desc">Name · Z → A</option>
                      <option value="productGroup-asc">Product group</option>
                      <option value="imo-asc">IMO · #1 → #10</option>
                      <option value="imo-desc">IMO · #10 → #1</option>
                    </select>
                  </div>

                  <!-- zoom (lanes-style views) -->
                  <div x-show="roadmapView === 'lanes' || roadmapView === 'endMonth'" class="flex items-center border border-zinc-200 rounded-md overflow-hidden">
                    <template x-for="opt in [{key:'year',label:'Year'},{key:'quarter',label:'Quarter'},{key:'month',label:'Month'}]" :key="opt.key">
                      <button @click="laneZoom = opt.key; refreshIcons()"
                              :class="laneZoom === opt.key ? 'bg-zinc-100 text-zinc-900' : 'text-zinc-500 hover:bg-zinc-50'"
                              class="px-2.5 py-1.5 text-[12px] font-medium border-r border-zinc-200 last:border-r-0"
                              x-text="opt.label"></button>
                    </template>
                  </div>

                  <!-- settings (lanes-style views) -->
                  <div x-show="roadmapView === 'lanes' || roadmapView === 'endMonth'" class="relative">
                    <button @click="roadmapSettingsOpen = !roadmapSettingsOpen; roadmapFiltersOpen = false; roadmapHideFieldsOpen = false; roadmapGroupByOpen = false; refreshIcons()"
                            :class="roadmapSettingsOpen ? 'bg-zinc-100 text-zinc-900' : 'text-zinc-600 hover:bg-zinc-50'"
                            class="px-2.5 py-1.5 rounded-md border border-zinc-200 text-[12px] font-medium flex items-center gap-1.5">
                      <i data-lucide="settings-2" class="w-3.5 h-3.5"></i>
                      <span>Settings</span>
                    </button>
                    <div x-show="roadmapSettingsOpen" @click.outside="roadmapSettingsOpen = false"
                         x-transition.opacity
                         class="absolute z-30 mt-1 right-0 w-72 bg-white border border-zinc-200 rounded-lg shadow-xl p-3">
                      <div class="text-[10.5px] uppercase tracking-wider font-semibold text-zinc-500 px-1 pb-1.5">Card placement</div>
                      <label class="flex items-center justify-between gap-2 px-2 py-1.5 rounded hover:bg-zinc-50 cursor-pointer text-[12.5px]">
                        <span class="inline-flex items-center gap-1.5">
                          <i data-lucide="calendar" class="w-3.5 h-3.5 text-zinc-400"></i>
                          <span>Show in start month</span>
                        </span>
                        <input type="checkbox" x-model="laneSettingsByView[roadmapView].showStart" @change="refreshIcons()" class="accent-lime-500 w-3.5 h-3.5">
                      </label>
                      <label class="flex items-center justify-between gap-2 px-2 py-1.5 rounded hover:bg-zinc-50 cursor-pointer text-[12.5px]">
                        <span class="inline-flex items-center gap-1.5">

                          </template>
                        </div>
                      </div>
                    </div>

                              </div>

                          <template x-for="g in INITIATIVE_PRODUCT_GROUPS" :key="g.key">

                                    <span x-show="currentLaneSettings().showRowHcs"
                                          class="inline-flex items-center gap-0.5 text-[10.5px] text-zinc-500 font-mono flex-none"

                                  <div class="flex flex-1 relative bg-[#f7f7f8]"

                                    </template>
                                    <div class="flex-1"></div>
                                    <template x-for="seg in laneCardSegments(g.key, sg)" :key="seg.ini.id">

                                              class="absolute z-[1] text-left rounded-md border bg-white hover:shadow-sm transition p-1.5 space-y-1 group"
                                              :class="seg.ini.deliveryStatus === 'delayed' ? 'border-red-400 hover:border-red-500' : 'border-zinc-200 hover:border-zinc-300'"
                                              :style="`left:${seg.left + 8}px;width:${seg.width - 16}px;top:${seg.top}px;`">

                                          <div class="flex items-start gap-1.5 min-w-0 flex-1">
                                            <template x-if="isFieldVisible('coverImage') && seg.ini.coverImage">
                                              <div class="w-7 h-7 flex-none rounded overflow-hidden border border-zinc-200 bg-zinc-50 flex items-center justify-center"
                                                   @mouseenter="onLaneCoverEnter($event, seg.ini)"
                                                   @mouseleave="onLaneCoverLeave()">
                                                <img :src="seg.ini.coverImage" alt="" class="w-full h-full object-cover" />
                                              </div>
                                            </template>
                                            <span class="text-[12.5px] font-medium text-zinc-900 leading-snug group-hover:text-lime-700 break-words min-w-0"
                                                  x-text="seg.ini.name"></span>
                                          </div>
                                          <template x-if="isFieldVisible('priority') && initiativePriorityMeta(seg.ini.priority)">
                                            <span class="text-[9px] font-semibold uppercase px-1 py-px rounded flex-none"
                                                  :style="`background:${initiativePriorityMeta(seg.ini.priority).bg};color:${initiativePriorityMeta(seg.ini.priority).fg}`"
                                                  x-text="initiativePriorityMeta(seg.ini.priority).label"></span>
                                          </template>
                                        </div>
                                        <div class="flex items-center gap-2 text-[9.5px] text-zinc-500 flex-wrap">
                                          <template x-if="isFieldVisible('deliveryStatus') && initiativeDeliveryStatusMeta(seg.ini.deliveryStatus)">
                                            <span class="inline-flex items-center gap-1 flex-none px-1 py-px rounded"
                                                  :style="`background:${initiativeDeliveryStatusMeta(seg.ini.deliveryStatus).bg};color:${initiativeDeliveryStatusMeta(seg.ini.deliveryStatus).fg}`">
                                              <span class="w-1 h-1 rounded-full" :style="`background:${initiativeDeliveryStatusMeta(seg.ini.deliveryStatus).color}`"></span>
                                              <span class="truncate" x-text="initiativeDeliveryStatusMeta(seg.ini.deliveryStatus).label"></span>
                                            </span>
                                          </template>
                                          <span x-show="isFieldVisible('developmentStage')" class="inline-flex items-center gap-1 flex-none">
                                            <span class="w-1 h-1 rounded-full" :style="`background:${initiativeDevelopmentStageMeta(seg.ini.developmentStage).color}`"></span>
                                            <span class="truncate" x-text="initiativeDevelopmentStageMeta(seg.ini.developmentStage).label"></span>
                                          </span>
                                          <template x-if="isFieldVisible('imo') && initiativeImoMeta(seg.ini.imo)">
                                            <span class="inline-flex items-center gap-1 flex-none"
                                                  :title="`${initiativeImoMeta(seg.ini.imo).code} ${initiativeImoMeta(seg.ini.imo).label}`">
                                              <span class="w-1 h-1 rounded-full" :style="`background:${initiativeImoMeta(seg.ini.imo).color}`"></span>
                                              <span class="font-mono truncate" x-text="initiativeImoMeta(seg.ini.imo).code"></span>
                                            </span>
                                          </template>
                                          <span x-show="isFieldVisible('productDri') || isFieldVisible('engDri')" class="flex -space-x-1.5 flex-none">

                                              <span class="w-4 h-4 rounded-full text-[8px] flex items-center justify-center font-semibold ring-1 ring-white"
                                                    :style="`background:${personById(seg.ini.productDri).avatarBg};color:${personById(seg.ini.productDri).avatarFg}`"
                                                    :title="`Product DRI · ${personById(seg.ini.productDri).name}`"
                                                    x-text="personById(seg.ini.productDri).initials"></span>
                                            </template>
                                            <template x-if="isFieldVisible('engDri') && personById(seg.ini.engDri)">
                                              <span class="w-4 h-4 rounded-full text-[8px] flex items-center justify-center font-semibold ring-1 ring-white"
                                                    :style="`background:${personById(seg.ini.engDri).avatarBg};color:${personById(seg.ini.engDri).avatarFg}`"
                                                    :title="`Eng DRI · ${personById(seg.ini.engDri).name}`"
                                                    x-text="personById(seg.ini.engDri).initials"></span>

                                            <span x-text="hcsFor(seg.ini)"></span>
                                          </span>
                                          <span x-show="isFieldVisible('countries')" class="inline-flex items-center gap-0.5 truncate">
                                            <template x-for="c in seg.ini.countries" :key="c">
                                              <span :title="initiativeCountryMeta(c)?.label || c" x-text="initiativeCountryMeta(c)?.flag"></span>
                                            </template>
                                          </span>
                                          <span x-show="isFieldVisible('endDate')" class="inline-flex items-center gap-0.5 font-mono flex-none ml-auto">
                                            <i data-lucide="flag" class="w-2.5 h-2.5"></i>
                                            <span x-text="fmtRoadmapDate(seg.ini.endDate)"></span>
                                          </span>
                                        </div>
                                      </button>
                                    </template>
                                  </div>
                                </div>
                              </template>
                            </div>
                          </template>

                          <div x-show="filteredInitiatives().length === 0" class="text-[12px] text-zinc-400 text-center py-10">
                            No initiatives match the current filters.
                          </div>

                          <template x-if="laneTodayLeft() !== null">
                            <div class="absolute top-0 bottom-0 pointer-events-none"
                                 :style="`left:${200 + laneTodayLeft()}px;`">
                              <div class="w-px h-full bg-zinc-900/80"></div>
                              <div class="absolute top-0 bottom-0 -left-1 w-2 pointer-events-auto group/today"
                                   x-data="{ ty: 0 }"
                                   @mousemove="ty = $event.offsetY">
                                <div class="absolute left-3 z-30 px-2 py-1 rounded-md bg-zinc-900 text-white text-[10.5px] font-mono whitespace-nowrap shadow-lg pointer-events-none opacity-0 group-hover/today:opacity-100 transition flex items-center gap-1.5"
                                     :style="`top:${ty - 10}px;`">
                                  <span class="w-1 h-1 rounded-full bg-zinc-100"></span>
                                  <span>Today · </span>
                                  <span x-text="fmtRoadmapDateLong(today)"></span>
                                </div>
                              </div>
                            </div>
                          </template>
                        </div>
                      </div>
                    </div>
                  </template>
                </div>
              </section>

              <!-- ============================================ PEOPLE MODULE ============================================ -->
              <section x-show="currentModule === 'people'" class="h-full flex flex-col">
                <div class="flex-none border-b border-zinc-200 bg-white px-5 pt-3.5 pb-3.5 flex items-center justify-between">
                  <div>
                    <h1 class="text-[18px] font-semibold tracking-tight">People</h1>
                    <p class="text-[12px] text-zinc-500">Everyone contributing to the product factory. Click someone to see their initiatives.</p>
                  </div>
                  <button class="text-[12px] font-semibold bg-lime-400 hover:bg-lime-500 text-zinc-900 px-3 py-1.5 rounded-md flex items-center gap-1.5">
                    <i data-lucide="user-plus" class="w-3.5 h-3.5"></i>
                    Add person
                  </button>
                </div>

                <div class="flex-none bg-white border-b border-zinc-200 px-5 py-2.5 flex items-center gap-2 flex-wrap">
                  <div class="relative">
                    <i data-lucide="search" class="w-3.5 h-3.5 text-zinc-400 absolute left-2.5 top-1/2 -translate-y-1/2"></i>
                    <input type="text" x-model="peopleSearch" placeholder="Search by name or role"
                           class="pl-7 pr-3 py-1.5 w-72 text-[12px] rounded-md bg-white border border-zinc-200 focus:outline-none focus:ring-2 focus:ring-lime-300 focus:border-lime-300 placeholder:text-zinc-400" />
                  </div>

                    <label class="text-[11px] text-zinc-500 flex items-center gap-1.5">

                      Sort

                    <select x-model="peopleSort" class="text-[12px] px-2 py-1.5 rounded-md border border-zinc-200 bg-white">
                      <option value="name-asc">Name · A → Z</option>
                      <option value="name-desc">Name · Z → A</option>
                      <option value="role-asc">Role</option>
                      <option value="initiatives-desc">Initiatives · most</option>
                      <option value="initiatives-asc">Initiatives · least</option>
                    </select>
                  </div>
                  <div class="ml-auto text-[11.5px] text-zinc-500" x-text="`${filteredPeople().length} people`"></div>
                </div>

                <div class="flex-1 overflow-auto p-5">
                  <p x-show="loading" class="text-[12px] text-zinc-500">Loading people…</p>
                  <p x-show="error" x-text="error" class="text-[12px] text-red-600"></p>

                  <div x-show="!loading && !error" class="bg-white border border-zinc-200 rounded-lg overflow-x-auto">
                    <div class="min-w-max">
                      <!-- header row -->
                      <div class="flex items-start gap-3 text-[10.5px] uppercase tracking-wider font-semibold text-zinc-400 px-4 py-2.5 border-b border-zinc-200 bg-zinc-50">
                        <div class="w-[260px] flex-none">Person</div>
                        <div class="w-[180px] flex-none">Role</div>
                        <div class="w-[80px]  flex-none text-right">Initiatives</div>
                        <div class="w-[560px] flex-none">Allocated to</div>
                      </div>

                      <template x-for="p in filteredPeople()" :key="p.id">
                        <button type="button" @click="openPerson(p)"
                                class="w-full text-left flex items-start gap-3 px-4 py-2.5 border-b border-zinc-100 hover:bg-zinc-50 transition group cursor-pointer">
                          <div class="w-[260px] flex-none min-w-0 flex items-center gap-2.5">
                            <div class="w-8 h-8 rounded-full text-[11.5px] flex items-center justify-center font-semibold flex-none"
                                 :style="`background:${p.avatarBg};color:${p.avatarFg}`"
                                 x-text="p.initials"></div>
                            <div class="min-w-0 flex-1">
                              <div class="text-[13px] font-medium text-zinc-900 truncate group-hover:text-lime-700" x-text="p.name"></div>
                              <div class="text-[10.5px] font-mono text-zinc-400 mt-0.5" x-text="p.id.slice(0, 8)"></div>
                            </div>
                          </div>
                          <div class="w-[180px] flex-none text-[12px] text-zinc-600 truncate self-center" x-text="p.role || '—'"></div>
                          <div class="w-[80px] flex-none text-right self-center">
                            <span class="inline-flex items-center gap-1 text-[11.5px] font-mono text-zinc-700">
                              <i data-lucide="map" class="w-3 h-3 text-zinc-400"></i>
                              <span x-text="p.initiative_ids.length"></span>
                            </span>
                          </div>
                          <div class="w-[560px] flex-none flex flex-wrap gap-1.5 self-center">
                            <template x-for="ini in initiativesForPerson(p).slice(0, 9)" :key="ini.id">
                              <span @click.stop="openInitiative(ini)"
                                    class="inline-flex items-center gap-1 text-[11px] px-1.5 py-0.5 rounded border border-zinc-200 bg-white hover:border-zinc-300 hover:bg-zinc-50 transition max-w-[170px] cursor-pointer">
                                <span class="w-1.5 h-1.5 rounded-full flex-none" :style="`background:${initiativeGroupMeta(ini.productGroup).color}`"></span>
                                <span class="truncate text-zinc-700" x-text="ini.name"></span>
                              </span>
                            </template>
                            <span x-show="initiativesForPerson(p).length > 9"
                                  class="inline-flex items-center text-[10.5px] text-zinc-400 px-1 self-center"
                                  x-text="`+${initiativesForPerson(p).length - 9} more`"></span>
                            <span x-show="initiativesForPerson(p).length === 0"
                                  class="text-[11px] text-zinc-400 italic">Not assigned to any initiative yet</span>
                          </div>
                        </button>
                      </template>

                      <div x-show="filteredPeople().length === 0" class="text-[12px] text-zinc-400 text-center py-10">
                        No people match the current search.
                      </div>
                    </div>
                  </div>
                </div>
              </section>

              <!-- ============================================ WIP PLACEHOLDER (other modules) ============================================ -->
              <template x-for="item in NAV.filter(n => n.wip)" :key="item.id">
                <section x-show="currentModule === item.id" class="h-full flex flex-col">
                  <div class="flex-none border-b border-zinc-200 bg-white px-5 pt-3.5 pb-3.5">
                    <h1 class="text-[18px] font-semibold tracking-tight" x-text="item.label"></h1>
                    <p class="text-[12px] text-zinc-500" x-text="`${item.group} · work in progress`"></p>

                  <div class="flex-1 flex items-center justify-center p-10">
                    <div class="text-center max-w-md">
                      <div class="w-12 h-12 mx-auto mb-3 rounded-xl bg-zinc-100 flex items-center justify-center text-zinc-400">

                      </p>
                    </div>
                  </div>
                </section>
              </template>

            </main>
          </div>

          <!-- INITIATIVE DETAIL DRAWER -->
          <div x-show="drawerOpen" x-transition.opacity class="fixed inset-0 z-40" @click.self="closeDrawer()" @keydown.escape.window="drawerOpen && closeDrawer()" style="background:rgba(15,15,17,0.35)">

                 x-transition:enter="transition ease-out duration-250"
                 x-transition:enter-start="translate-x-full"
                 x-transition:enter-end="translate-x-0"
                 x-transition:leave="transition ease-in duration-200"
                 x-transition:leave-start="translate-x-0"
                 x-transition:leave-end="translate-x-full"
                 class="absolute inset-y-0 right-0 w-[520px] bg-white shadow-2xl flex flex-col"
                 style="box-shadow:-16px 0 48px -12px rgba(0,0,0,0.18)">

                    <template x-if="drawerInitiative.coverImage">

                        <img :src="drawerInitiative.coverImage" alt="cover" class="w-full h-[160px] object-cover bg-zinc-100" />

                          <label class="inline-flex items-center gap-1 text-[11px] font-medium px-2 py-1 rounded bg-black/60 hover:bg-black/75 text-white cursor-pointer backdrop-blur-sm">
                            <i data-lucide="image" class="w-3 h-3"></i>
                            <span>Replace</span>
                            <input type="file" accept="image/png,image/jpeg,image/jpg,image/gif,image/webp,image/svg+xml" class="sr-only" @change="onCoverImageUpload($event, drawerInitiative)" />
                          </label>
                          <button type="button"
                                  @click="removeCoverImage(drawerInitiative)"
                                  class="inline-flex items-center gap-1 text-[11px] font-medium px-2 py-1 rounded bg-black/60 hover:bg-black/75 text-white backdrop-blur-sm">
                            <i data-lucide="trash-2" class="w-3 h-3"></i>
                            <span>Remove</span>
                          </button>
                        </div>
                      </div>
                    </template>
                    <template x-if="!drawerInitiative.coverImage">
                      <label class="block px-5 pt-4 pb-1 cursor-pointer">
                        <div class="text-[11.5px] text-zinc-400 hover:text-zinc-700 inline-flex items-center gap-1.5 transition">
                          <i data-lucide="image" class="w-3.5 h-3.5"></i>
                          <span>Add cover image</span>
                        </div>
                        <input type="file" accept="image/png,image/jpeg,image/jpg,image/gif,image/webp,image/svg+xml" class="sr-only" @change="onCoverImageUpload($event, drawerInitiative)" />
                      </label>
                    </template>
                  </div>

                  <!-- header -->
                  <div class="flex-none px-5 pt-5 pb-4 border-b border-zinc-100">
                    <div class="flex items-start justify-between mb-3">
                      <div class="flex items-center gap-2 flex-wrap">
                        <!-- archived / deleted chip — only shown when not active -->
                        <template x-if="drawerInitiative.initiativeStatus !== 'active'">

                            <span class="w-1 h-1 rounded-full" :style="`background:${initiativeStatusMeta(drawerInitiative.initiativeStatus).color}`"></span>
                            <span x-text="initiativeStatusMeta(drawerInitiative.initiativeStatus).label"></span>
                          </span>

                        <template x-if="initiativePriorityMeta(drawerInitiative.priority)">

                                x-text="initiativePriorityMeta(drawerInitiative.priority).label"></span>

                        <template x-if="initiativeDeliveryStatusMeta(drawerInitiative.deliveryStatus)">

                            <span class="w-1 h-1 rounded-full" :style="`background:${initiativeDeliveryStatusMeta(drawerInitiative.deliveryStatus).color}`"></span>
                            <span x-text="initiativeDeliveryStatusMeta(drawerInitiative.deliveryStatus).label"></span>
                          </span>
                        </template>
                        <span :class="`pill-${drawerInitiative.developmentStage}`" class="text-[10px] font-medium px-1.5 py-0.5 rounded" x-text="initiativeDevelopmentStageMeta(drawerInitiative.developmentStage).label"></span>
                        <span class="inline-flex items-center gap-1 text-[10px] px-1.5 py-0.5 rounded font-medium"
                              :style="`background:${initiativeGroupMeta(drawerInitiative.productGroup).color}1A;color:${initiativeGroupMeta(drawerInitiative.productGroup).color}`">
                          <span class="w-1 h-1 rounded-full" :style="`background:${initiativeGroupMeta(drawerInitiative.productGroup).color}`"></span>
                          <span x-text="initiativeGroupMeta(drawerInitiative.productGroup).label"></span>
                        </span>
                        <span class="text-[10px] font-mono text-zinc-400" x-text="drawerInitiative.id.slice(0, 8)"></span>
                      </div>
                      <button @click="closeDrawer()" class="p-1 rounded hover:bg-zinc-100 text-zinc-500">
                        <i data-lucide="x" class="w-4 h-4"></i>
                      </button>
                    </div>
                    <input type="text"
                           x-model="drawerInitiative.name"
                           @change="saveInitiative(drawerInitiative)"
                           :placeholder="drawerMode === 'create' ? 'New initiative' : 'Initiative name…'"
                           class="w-full text-[20px] font-semibold leading-tight bg-transparent border border-transparent hover:border-zinc-200 focus:border-zinc-300 focus:outline-none focus:ring-0 rounded-md -mx-1.5 px-1.5 py-0.5 placeholder-zinc-300 transition-colors" />
                    <div class="text-[12px] text-zinc-500 mt-1.5 flex items-center gap-1.5">
                      <i data-lucide="folder" class="w-3.5 h-3.5"></i>
                      <span x-text="initiativeGroupMeta(drawerInitiative.productGroup).label"></span>
                      <span class="w-1 h-1 rounded-full bg-zinc-300"></span>
                      <span x-text="drawerInitiative.subGroup"></span>
                    </div>
                  </div>

                  <!-- scrollable body -->
                  <div class="flex-1 overflow-y-auto px-5 py-4 space-y-5">

                    <!-- timeline summary -->
                    <div class="rounded-lg bg-zinc-50 border border-zinc-100 p-3">
                      <div class="flex items-center justify-between mb-2">
                        <div class="text-[10px] uppercase tracking-wider text-zinc-400 font-semibold">Timeline</div>
                        <div class="text-[10.5px] font-mono text-zinc-500" x-text="`${initiativeDurationDays(drawerInitiative)} days`"></div>
                      </div>
                      <div class="flex items-center justify-between text-[12px] text-zinc-700 mb-2">
                        <div class="flex items-center gap-1.5">
                          <i data-lucide="calendar" class="w-3.5 h-3.5 text-zinc-400"></i>
                          <span class="font-medium" x-text="fmtRoadmapDateLong(drawerInitiative.startDate)"></span>
                        </div>
                        <i data-lucide="arrow-right" class="w-3.5 h-3.5 text-zinc-400"></i>
                        <div class="flex items-center gap-1.5">
                          <span class="font-medium" x-text="fmtRoadmapDateLong(drawerInitiative.endDate)"></span>
                          <i data-lucide="flag" class="w-3.5 h-3.5 text-zinc-400"></i>
                        </div>
                      </div>
                      <div class="relative h-1.5 rounded-full bg-zinc-200 overflow-hidden">
                        <div class="absolute inset-y-0 left-0 rounded-full"
                             :style="`width:${initiativeProgressPct(drawerInitiative)}%;background:${initiativeDevelopmentStageMeta(drawerInitiative.developmentStage).color}`"></div>
                      </div>
                      <div class="mt-1.5 text-[10.5px] font-mono text-zinc-500 flex items-center justify-between">
                        <span x-text="`${initiativeProgressPct(drawerInitiative)}% elapsed`"></span>
                        <span x-show="drawerInitiative.developmentStage === 'shipped'" class="text-emerald-700 font-semibold">Shipped</span>
                      </div>
                    </div>

                    <!-- edit form -->
                    <div class="space-y-3.5">

                      <!-- IMO -->
                      <div>
                        <label class="block text-[10px] uppercase tracking-wider text-zinc-400 font-semibold mb-1">IMO</label>
