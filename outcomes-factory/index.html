<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Outcomes Factory has moved</title>
  <meta name="robots" content="noindex">
  <link rel="canonical" href="https://outcomes-factory.teya.xyz/">
  <!-- Static fallback if JS is disabled. JS below handles it instantly and preserves
       any query string / hash (e.g. Supabase magic-link tokens). -->
  <meta http-equiv="refresh" content="0; url=https://outcomes-factory.teya.xyz/">
  <script>
    // Preserve query + hash so auth callbacks (magic links, invites) that still land
    // on the old bernardocb.com origin carry their token through to the new domain.
    var target = "https://outcomes-factory.teya.xyz/" + location.search + location.hash;
    location.replace(target);
  </script>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; background: #0f1115; color: #e6e6e6;
           display: flex; min-height: 100vh; margin: 0; align-items: center; justify-content: center; }
    .card { text-align: center; max-width: 28rem; padding: 2rem; }
    a { color: #7aa2ff; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Outcomes Factory has moved</h1>
    <p>This app now lives at
      <a href="https://outcomes-factory.teya.xyz/">outcomes-factory.teya.xyz</a>.</p>
    <p>Redirecting you now…</p>
  </div>
</body>
</html>
