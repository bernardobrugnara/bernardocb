                          <template x-if="initiativeImoMeta(drawerInitiative.imo)">
                            <span class="w-1.5 h-1.5 rounded-full flex-none" :style="`background:${initiativeImoMeta(drawerInitiative.imo).color}`"></span>
                          </template>
                          <span class="text-[12.5px] flex-1 truncate"
                                :class="initiativeImoMeta(drawerInitiative.imo) ? 'text-zinc-900' : 'text-zinc-400'"
                                x-text="initiativeImoMeta(drawerInitiative.imo) ? `${initiativeImoMeta(drawerInitiative.imo).code} ${initiativeImoMeta(drawerInitiative.imo).label}` : 'Unassigned'"></span>
                          <i data-lucide="chevron-down" class="w-3.5 h-3.5 text-zinc-400 flex-none"></i>
                          <select x-model="drawerInitiative.imo"
                                  x-effect="$nextTick(() => { $el.value = drawerInitiative?.imo ?? '' })"
                                  @change="saveInitiative(drawerInitiative)"
                                  class="absolute inset-0 w-full h-full opacity-0 cursor-pointer">
                            <option value="">Unassigned</option>
                            <template x-for="imo in INITIATIVE_IMOS" :key="imo.key">
                              <option :value="imo.key" x-text="`${imo.code} ${imo.label}`"></option>
                            </template>
                          </select>
                        </div>
                      </div>

                      <!-- key metric -->
                      <div>
                        <label class="block text-[10px] uppercase tracking-wider text-zinc-400 font-semibold mb-1 flex items-center gap-1">
                          <i data-lucide="gauge" class="w-3 h-3"></i>
                          Key metric
                        </label>
                        <input type="text"
                               x-model="drawerInitiative.keyMetric"
                               @change="saveInitiative(drawerInitiative)"
                               placeholder="e.g. €100M TPV by EOY"
                               class="w-full px-2.5 py-1.5 text-[12.5px] rounded-md border border-zinc-200 bg-white focus:border-lime-400 focus:outline-none focus:ring-2 focus:ring-lime-300" />
                      </div>

                      <!-- dates -->
                      <div class="grid grid-cols-3 gap-3">
                        <div>
                          <label class="block text-[10px] uppercase tracking-wider text-zinc-400 font-semibold mb-1">Start date</label>
                          <input type="date"
                                 x-model="drawerInitiative.startDate"
                                 @change="ensureValidDateRange(drawerInitiative, 'startDate')"
                                 class="w-full px-2.5 py-1.5 text-[12.5px] font-mono rounded-md border border-zinc-200 bg-white focus:border-lime-400 focus:outline-none focus:ring-2 focus:ring-lime-300" />
                        </div>
                        <div>
                          <label class="block text-[10px] uppercase tracking-wider text-zinc-400 font-semibold mb-1">End date</label>
                          <input type="date"
                                 x-model="drawerInitiative.endDate"
                                 :min="drawerInitiative.startDate"
                                 @change="ensureValidDateRange(drawerInitiative, 'endDate')"
                                 class="w-full px-2.5 py-1.5 text-[12.5px] font-mono rounded-md border border-zinc-200 bg-white focus:border-lime-400 focus:outline-none focus:ring-2 focus:ring-lime-300" />
                        </div>
                        <div>
                          <label class="block text-[10px] uppercase tracking-wider text-zinc-400 font-semibold mb-1" title="Original committed launch date — compare with End date to detect slip">Orig. launch</label>
                          <input type="date"
                                 x-model="drawerInitiative.originalLaunchDate"
                                 @change="saveInitiative(drawerInitiative)"
                                 class="w-full px-2.5 py-1.5 text-[12.5px] font-mono rounded-md border border-zinc-200 bg-white focus:border-lime-400 focus:outline-none focus:ring-2 focus:ring-lime-300" />
                        </div>
                      </div>

                      <!-- priority + delivery status + status + HCs -->
                      <div class="grid grid-cols-[1fr_1fr_1fr_72px] gap-3">
                        <div>
                          <label class="block text-[10px] uppercase tracking-wider text-zinc-400 font-semibold mb-1">Priority</label>
                          <select x-model="drawerInitiative.priority"
                                  x-effect="$nextTick(() => { $el.value = drawerInitiative?.priority ?? '' })"
                                  @change="saveInitiative(drawerInitiative)"
                                  class="w-full px-2.5 py-1.5 text-[12.5px] rounded-md border border-zinc-200 bg-white focus:border-lime-400 focus:outline-none focus:ring-2 focus:ring-lime-300">
                            <option value="">—</option>
                            <template x-for="p in INITIATIVE_PRIORITIES" :key="p.key">
                              <option :value="p.key" x-text="p.label"></option>
                            </template>
                          </select>
                        </div>
                        <div>
                          <label class="block text-[10px] uppercase tracking-wider text-zinc-400 font-semibold mb-1">Delivery</label>
                          <select x-model="drawerInitiative.deliveryStatus"
                                  x-effect="$nextTick(() => { $el.value = drawerInitiative?.deliveryStatus ?? '' })"
                                  @change="saveInitiative(drawerInitiative)"
                                  class="w-full px-2.5 py-1.5 text-[12.5px] rounded-md border border-zinc-200 bg-white focus:border-lime-400 focus:outline-none focus:ring-2 focus:ring-lime-300">
                            <option :value="null">—</option>
                            <template x-for="d in INITIATIVE_DELIVERY_STATUSES" :key="d.key">
                              <option :value="d.key" x-text="d.label"></option>
                            </template>
                          </select>
                        </div>
                        <div>
                          <label class="block text-[10px] uppercase tracking-wider text-zinc-400 font-semibold mb-1">Dev stage</label>
                          <select x-model="drawerInitiative.developmentStage"
                                  x-effect="$nextTick(() => { $el.value = drawerInitiative?.developmentStage ?? '' })"
                                  @change="saveInitiative(drawerInitiative)"
                                  class="w-full px-2.5 py-1.5 text-[12.5px] rounded-md border border-zinc-200 bg-white focus:border-lime-400 focus:outline-none focus:ring-2 focus:ring-lime-300">
                            <template x-for="s in INITIATIVE_DEVELOPMENT_STAGES" :key="s.key">
                              <option :value="s.key" x-text="s.label"></option>
                            </template>
                          </select>
                        </div>
                        <div>
                          <label class="block text-[10px] uppercase tracking-wider text-zinc-400 font-semibold mb-1 flex items-center gap-1">
                            <i data-lucide="users" class="w-3 h-3"></i>
                            HCs
                          </label>
                          <div class="w-full px-2.5 py-1.5 text-[12.5px] font-mono rounded-md border border-zinc-100 bg-zinc-50 text-zinc-700"
                               title="Auto · sum of people allocated to this initiative">
                            <span x-text="hcsFor(drawerInitiative)"></span>
                          </div>
                        </div>
                      </div>

                      <!-- product group + sub-group -->
                      <div class="grid grid-cols-2 gap-3">
                        <div>
                          <label class="block text-[10px] uppercase tracking-wider text-zinc-400 font-semibold mb-1">Product group</label>
                          <select x-model="drawerInitiative.productGroup"
                                  x-effect="$nextTick(() => { $el.value = drawerInitiative?.productGroup ?? '' })"
                                  @change="onProductGroupChange(drawerInitiative)"
                                  class="w-full px-2.5 py-1.5 text-[12.5px] rounded-md border border-zinc-200 bg-white focus:border-lime-400 focus:outline-none focus:ring-2 focus:ring-lime-300">
                            <template x-for="g in INITIATIVE_PRODUCT_GROUPS" :key="g.key">
                              <option :value="g.key" x-text="g.label"></option>
                            </template>
                          </select>
                        </div>
                        <div>
                          <label class="block text-[10px] uppercase tracking-wider text-zinc-400 font-semibold mb-1">Sub-group</label>
                          <select x-model="drawerInitiative.subGroup"
                                  x-effect="$nextTick(() => { $el.value = drawerInitiative?.subGroup ?? '' })"
                                  @change="saveInitiative(drawerInitiative)"
                                  class="w-full px-2.5 py-1.5 text-[12.5px] rounded-md border border-zinc-200 bg-white focus:border-lime-400 focus:outline-none focus:ring-2 focus:ring-lime-300">
                            <template x-for="sg in subGroupsFor(drawerInitiative.productGroup)" :key="sg">
                              <option :value="sg" x-text="sg"></option>
                            </template>
                          </select>
                        </div>
                      </div>

                      <!-- DRIs -->
                      <div>
                        <div class="text-[10px] uppercase tracking-wider text-zinc-400 font-semibold mb-1.5">Directly Responsible Individuals</div>
                        <div class="grid grid-cols-2 gap-2">
                          <!-- Product DRI -->
                          <div class="relative rounded-lg bg-white border border-zinc-200 hover:border-zinc-300 focus-within:border-lime-400 focus-within:ring-2 focus-within:ring-lime-300 transition">
                            <div class="flex items-center gap-2.5 px-2.5 py-2">
                              <template x-if="personById(drawerInitiative.productDri)">
                                <div class="w-9 h-9 rounded-full text-[11px] flex items-center justify-center font-semibold flex-none"
                                     :style="`background:${personById(drawerInitiative.productDri).avatarBg};color:${personById(drawerInitiative.productDri).avatarFg}`"
                                     x-text="personById(drawerInitiative.productDri).initials"></div>
                              </template>
                              <template x-if="!personById(drawerInitiative.productDri)">
                                <div class="w-9 h-9 rounded-full bg-zinc-100 text-zinc-400 flex items-center justify-center flex-none">
                                  <i data-lucide="user" class="w-4 h-4"></i>
                                </div>
                              </template>
                              <div class="flex-1 min-w-0">
                                <div class="text-[10px] uppercase tracking-wider text-zinc-400 font-semibold">Product DRI</div>
                                <div class="text-[12.5px] font-semibold text-zinc-900 truncate"
                                     x-text="personById(drawerInitiative.productDri)?.name || 'Unassigned'"></div>
                              </div>
                              <i data-lucide="chevron-down" class="w-4 h-4 text-zinc-400 flex-none"></i>
                            </div>
                            <select x-model="drawerInitiative.productDri"
                                    x-effect="$nextTick(() => { $el.value = drawerInitiative?.productDri ?? '' })"
                                    @change="saveInitiative(drawerInitiative)"
                                    class="absolute inset-0 w-full h-full opacity-0 cursor-pointer">
                              <option value="">Unassigned</option>
                              <template x-for="p in people" :key="p.id">
                                <option :value="p.id" x-text="`${p.name} · ${p.role}`"></option>
                              </template>
                            </select>
                          </div>
                          <!-- Eng DRI -->
                          <div class="relative rounded-lg bg-white border border-zinc-200 hover:border-zinc-300 focus-within:border-lime-400 focus-within:ring-2 focus-within:ring-lime-300 transition">
                            <div class="flex items-center gap-2.5 px-2.5 py-2">
                              <template x-if="personById(drawerInitiative.engDri)">
                                <div class="w-9 h-9 rounded-full text-[11px] flex items-center justify-center font-semibold flex-none"
                                     :style="`background:${personById(drawerInitiative.engDri).avatarBg};color:${personById(drawerInitiative.engDri).avatarFg}`"
                                     x-text="personById(drawerInitiative.engDri).initials"></div>
                              </template>
                              <template x-if="!personById(drawerInitiative.engDri)">
                                <div class="w-9 h-9 rounded-full bg-zinc-100 text-zinc-400 flex items-center justify-center flex-none">
                                  <i data-lucide="user" class="w-4 h-4"></i>
                                </div>
                              </template>
                              <div class="flex-1 min-w-0">
                                <div class="text-[10px] uppercase tracking-wider text-zinc-400 font-semibold">Engineering DRI</div>
                                <div class="text-[12.5px] font-semibold text-zinc-900 truncate"
                                     x-text="personById(drawerInitiative.engDri)?.name || 'Unassigned'"></div>
                              </div>
                              <i data-lucide="chevron-down" class="w-4 h-4 text-zinc-400 flex-none"></i>
                            </div>
                            <select x-model="drawerInitiative.engDri"
                                    x-effect="$nextTick(() => { $el.value = drawerInitiative?.engDri ?? '' })"
                                    @change="saveInitiative(drawerInitiative)"
                                    class="absolute inset-0 w-full h-full opacity-0 cursor-pointer">
                              <option value="">Unassigned</option>
                              <template x-for="p in people" :key="p.id">
                                <option :value="p.id" x-text="`${p.name} · ${p.role}`"></option>
                              </template>
                            </select>
                          </div>
                        </div>
                      </div>

                      <!-- allocated team -->
                      <div>
                        <div class="text-[10px] uppercase tracking-wider text-zinc-400 font-semibold mb-1.5 flex items-center justify-between">
                          <span>Allocated team</span>
                          <span class="text-[10.5px] font-mono text-zinc-400 normal-case tracking-normal" x-text="`${hcsFor(drawerInitiative)} people`"></span>
                        </div>
                        <div class="flex flex-wrap gap-1.5">
                          <template x-for="p in peopleOnInitiative(drawerInitiative.id)" :key="p.id">
                            <span class="inline-flex items-center gap-1.5 text-[11.5px] bg-white border border-zinc-200 text-zinc-700 px-1.5 py-1 rounded font-medium">
                              <span class="w-5 h-5 rounded-full text-[9px] flex items-center justify-center font-semibold flex-none"
                                    :style="`background:${p.avatarBg};color:${p.avatarFg}`"
                                    x-text="p.initials"></span>
                              <span x-text="p.name"></span>
                            </span>
                          </template>
                          <div x-show="peopleOnInitiative(drawerInitiative.id).length === 0" class="text-[11.5px] text-zinc-400 italic">
                            No one allocated yet. Add this initiative to people in the People module.
                          </div>
                        </div>
                      </div>

                      <!-- countries -->
                      <div>
                        <div class="text-[10px] uppercase tracking-wider text-zinc-400 font-semibold mb-1.5 flex items-center justify-between">
                          <span>Available countries</span>
                          <span class="text-[10.5px] font-mono text-zinc-400 normal-case tracking-normal" x-text="`${drawerInitiative.countries.length}/${INITIATIVE_COUNTRIES.length}`"></span>
                        </div>
                        <div class="flex flex-wrap gap-1.5">
                          <template x-for="c in INITIATIVE_COUNTRIES" :key="c.code">
                            <button type="button"
                                    @click="toggleInitiativeCountry(drawerInitiative, c.code)"
                                    :class="drawerInitiative.countries.includes(c.code)
                                              ? 'bg-lime-50 border-lime-300 text-lime-800'
                                              : 'bg-white border-zinc-200 text-zinc-600 hover:bg-zinc-50'"
                                    class="inline-flex items-center gap-1.5 text-[11.5px] px-2 py-1 rounded font-medium border transition">
                              <span x-text="c.flag"></span>
                              <span x-text="c.label"></span>
                              <i x-show="drawerInitiative.countries.includes(c.code)" data-lucide="check" class="w-3 h-3"></i>
                            </button>
                          </template>
                        </div>
                      </div>

                      <!-- description -->
                      <div>
                        <label class="block text-[10px] uppercase tracking-wider text-zinc-400 font-semibold mb-1">Description</label>
                        <textarea x-model="drawerInitiative.description"
                                  @change="saveInitiative(drawerInitiative)"
                                  rows="4"
                                  placeholder="What this initiative is about…"
                                  class="w-full px-2.5 py-2 text-[12.5px] leading-snug rounded-md border border-zinc-200 bg-white focus:border-lime-400 focus:outline-none focus:ring-2 focus:ring-lime-300 resize-y"></textarea>
                      </div>

                    </div>
                  </div>

                  <!-- footer -->
                  <div class="flex-none px-5 py-3 border-t border-zinc-100 flex items-center gap-2">
                    <div class="text-[11px] text-zinc-400 flex items-center gap-1.5">
                      <template x-if="drawerMode === 'edit'">
                        <span class="flex items-center gap-1.5">
                          <i data-lucide="check-circle-2" class="w-3.5 h-3.5 text-lime-500"></i>
                          <span>Changes saved automatically</span>
                        </span>
                      </template>
                      <template x-if="drawerMode === 'create'">
                        <span class="flex items-center gap-1.5">
                          <i data-lucide="circle-dashed" class="w-3.5 h-3.5 text-zinc-400"></i>
                          <span>Draft — click Create to save</span>
                        </span>
                      </template>
                    </div>
                    <div class="flex-1"></div>

                    <!-- ===== edit-mode actions ===== -->
                    <!-- restore (when archived or deleted) -->
                    <button x-show="drawerMode === 'edit' && drawerInitiative.initiativeStatus !== 'active'"
                            @click="setInitiativeStatus(drawerInitiative.id, 'active')"
                            class="text-[12px] font-medium px-2.5 py-2 rounded-md border border-zinc-200 bg-white hover:bg-zinc-50 text-zinc-700 flex items-center gap-1.5">
                      <i data-lucide="rotate-ccw" class="w-3.5 h-3.5"></i>
                      <span>Restore</span>
                    </button>

                    <!-- archive (when active) -->
                    <button x-show="drawerMode === 'edit' && drawerInitiative.initiativeStatus === 'active'"
                            @click="setInitiativeStatus(drawerInitiative.id, 'archived')"
                            class="text-[12px] font-medium px-2.5 py-2 rounded-md border border-amber-200 bg-amber-50 hover:bg-amber-100 text-amber-800 flex items-center gap-1.5">
                      <i data-lucide="archive" class="w-3.5 h-3.5"></i>
                      <span>Archive</span>
                    </button>

                    <!-- delete (when not already deleted) -->
                    <button x-show="drawerMode === 'edit' && drawerInitiative.initiativeStatus !== 'deleted'"
                            @click="confirm(`Delete “${drawerInitiative.name}”? It will be hidden from default views but you can restore it later via the filter.`) && setInitiativeStatus(drawerInitiative.id, 'deleted')"
                            class="text-[12px] font-medium px-2.5 py-2 rounded-md border border-red-200 bg-red-50 hover:bg-red-100 text-red-700 flex items-center gap-1.5">
                      <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                      <span>Delete</span>
                    </button>

                    <!-- ===== create-mode action ===== -->
                    <button x-show="drawerMode === 'create'"
                            @click="submitNewInitiative()"
                            class="text-[12px] font-semibold px-3 py-2 rounded-md bg-lime-400 hover:bg-lime-500 text-zinc-900 flex items-center gap-1.5">
                      <i data-lucide="plus" class="w-3.5 h-3.5"></i>
                      <span>Create</span>
                    </button>
                  </div>

                </div>
              </template>
            </div>
          </div>

          <!-- ============================================ PERSON DRAWER ============================================ -->
          <div x-show="personDrawerOpen" x-transition.opacity class="fixed inset-0 z-40" @click.self="closePersonDrawer()" @keydown.escape.window="personDrawerOpen && closePersonDrawer()" style="background:rgba(15,15,17,0.35)">
            <div x-show="personDrawerOpen"
                 x-transition:enter="transition ease-out duration-250"
                 x-transition:enter-start="translate-x-full"
                 x-transition:enter-end="translate-x-0"
                 x-transition:leave="transition ease-in duration-200"
                 x-transition:leave-start="translate-x-0"
                 x-transition:leave-end="translate-x-full"
                 class="absolute inset-y-0 right-0 w-[480px] bg-white shadow-2xl flex flex-col"
                 style="box-shadow:-16px 0 48px -12px rgba(0,0,0,0.18)">

              <template x-if="personDrawerPerson">
                <div class="flex flex-col h-full">

                  <!-- header -->
                  <div class="flex-none px-5 pt-5 pb-4 border-b border-zinc-100">
                    <div class="flex items-start justify-between mb-4">
                      <div class="flex items-center gap-3 min-w-0">
                        <div class="w-12 h-12 rounded-full text-[15px] flex items-center justify-center font-semibold flex-none"
                             :style="`background:${personDrawerPerson.avatarBg};color:${personDrawerPerson.avatarFg}`"
                             x-text="personDrawerPerson.initials"></div>
                        <div class="min-w-0">
                          <div class="text-[10px] font-mono text-zinc-400" x-text="personDrawerPerson.id.slice(0, 8)"></div>
                          <div class="text-[18px] font-semibold tracking-tight text-zinc-900 truncate" x-text="personDrawerPerson.name"></div>
                        </div>
                      </div>
                      <button @click="closePersonDrawer()" class="p-1 rounded hover:bg-zinc-100 text-zinc-500 flex-none">
                        <i data-lucide="x" class="w-4 h-4"></i>
                      </button>
                    </div>
                  </div>

                  <!-- scrollable body -->
                  <div class="flex-1 overflow-y-auto px-5 py-4 space-y-4">

                    <!-- edit form -->
                    <div class="space-y-3.5">
                      <div>
                        <label class="block text-[10px] uppercase tracking-wider text-zinc-400 font-semibold mb-1">Name</label>
                        <input type="text"
                               x-model="personDrawerPerson.name"
                               @change="savePerson(personDrawerPerson)"
                               placeholder="Full name…"
                               class="w-full px-2.5 py-1.5 text-[12.5px] rounded-md border border-zinc-200 bg-white focus:border-lime-400 focus:outline-none focus:ring-2 focus:ring-lime-300" />
                      </div>
                      <div>
                        <label class="block text-[10px] uppercase tracking-wider text-zinc-400 font-semibold mb-1">Role</label>
                        <input type="text"
                               x-model="personDrawerPerson.role"
                               @change="savePerson(personDrawerPerson)"
                               placeholder="e.g. Product Manager"
                               class="w-full px-2.5 py-1.5 text-[12.5px] rounded-md border border-zinc-200 bg-white focus:border-lime-400 focus:outline-none focus:ring-2 focus:ring-lime-300" />
                      </div>
                      <div>
                        <label class="block text-[10px] uppercase tracking-wider text-zinc-400 font-semibold mb-1">Email</label>
                        <input type="email"
                               x-model="personDrawerPerson.email"
                               @change="savePerson(personDrawerPerson)"
                               placeholder="person@teya.com"
                               class="w-full px-2.5 py-1.5 text-[12.5px] rounded-md border border-zinc-200 bg-white focus:border-lime-400 focus:outline-none focus:ring-2 focus:ring-lime-300" />
                      </div>
                    </div>

                    <!-- allocated initiatives -->
                    <div class="pt-2">
                      <div class="flex items-center justify-between mb-2">
                        <div class="text-[10px] uppercase tracking-wider text-zinc-400 font-semibold">Allocated initiatives</div>
                        <span class="text-[10.5px] font-mono text-zinc-400 normal-case tracking-normal"
                              x-text="`${initiativesForPerson(personDrawerPerson).length} total`"></span>
                      </div>
                      <div class="space-y-1.5">
                        <template x-for="ini in initiativesForPerson(personDrawerPerson)" :key="ini.id">
                          <button @click="closePersonDrawer(); openInitiative(ini)"
                                  class="w-full flex items-center gap-2 px-2.5 py-2 rounded-md border border-zinc-200 bg-white hover:border-zinc-300 hover:bg-zinc-50 transition text-left group">
                            <span class="w-1.5 h-1.5 rounded-full flex-none" :style="`background:${initiativeGroupMeta(ini.productGroup).color}`"></span>
                            <span class="flex-1 min-w-0 truncate text-[12.5px] text-zinc-900 group-hover:text-lime-700" x-text="ini.name"></span>
                            <template x-if="initiativeDeliveryStatusMeta(ini.deliveryStatus)">
                              <span class="inline-flex items-center gap-1 text-[10px] font-medium px-1.5 py-0.5 rounded flex-none"
                                    :style="`background:${initiativeDeliveryStatusMeta(ini.deliveryStatus).bg};color:${initiativeDeliveryStatusMeta(ini.deliveryStatus).fg}`">
                                <span class="w-1 h-1 rounded-full" :style="`background:${initiativeDeliveryStatusMeta(ini.deliveryStatus).color}`"></span>
                                <span x-text="initiativeDeliveryStatusMeta(ini.deliveryStatus).label"></span>
                              </span>
                            </template>
                          </button>
                        </template>
                        <div x-show="initiativesForPerson(personDrawerPerson).length === 0"
                             class="text-[11.5px] text-zinc-400 italic">Not assigned to any initiative yet.</div>
                      </div>
                    </div>

                  </div>

                  <!-- footer -->
                  <div class="flex-none px-5 py-3 border-t border-zinc-100 flex items-center gap-2">
                    <div class="text-[11px] text-zinc-400 flex items-center gap-1.5">
                      <i data-lucide="check-circle-2" class="w-3.5 h-3.5 text-lime-500"></i>
                      <span>Changes saved automatically</span>
                    </div>
                    <div class="flex-1"></div>
                    <button @click="closePersonDrawer()" class="text-[12px] font-semibold px-3 py-2 rounded-md bg-zinc-900 hover:bg-zinc-800 text-white">
                      Done
                    </button>
                  </div>

                </div>
              </template>
            </div>
          </div>

          <!-- LANES cover hover preview (fixed-positioned tooltip) -->
          <template x-if="lanesCoverHover">
            <div class="fixed z-50 pointer-events-none rounded-lg border border-zinc-200 bg-white shadow-2xl overflow-hidden"
                 :style="`top:${lanesCoverHover.top}px;left:${lanesCoverHover.left}px;width:280px;height:220px;`">
              <img :src="lanesCoverHover.src" :alt="lanesCoverHover.name" class="w-full h-full object-cover" />
              <div class="absolute bottom-0 left-0 right-0 px-2.5 py-1.5 bg-gradient-to-t from-black/70 to-transparent text-white text-[11px] font-medium truncate"
                   x-text="lanesCoverHover.name"></div>
            </div>
          </template>
        </div>
      </template>
    </div>

    <script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
  </body>
</html>
