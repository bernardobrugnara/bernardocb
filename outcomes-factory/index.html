                              <div class="text-[12px] text-zinc-700 truncate" x-text="reportUploaderName(r.uploadedByEmail)"></div>
                              <div class="text-[10.5px] text-zinc-400 truncate" x-text="r.uploadedByEmail"></div>
                            </div>
                          </div>
                          <div class="w-[80px] flex-none flex items-center justify-end gap-1 self-center">
                            <span @click.stop="openReport(r)"
                                  class="p-1.5 rounded hover:bg-zinc-100 text-zinc-500 hover:text-zinc-900 cursor-pointer"
                                  title="Open in new tab">
                              <i data-lucide="external-link" class="w-3.5 h-3.5"></i>
                            </span>
                            <span @click.stop="removeReport(r)"
                                  class="p-1.5 rounded hover:bg-red-50 text-zinc-400 hover:text-red-600 cursor-pointer"
                                  title="Delete">
                              <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                            </span>
                          </div>
                        </div>
                      </template>

                      <div x-show="filteredReports().length === 0 && reports.length > 0" class="text-[12px] text-zinc-400 text-center py-10">
                        No reports match the current search.
                      </div>
                      <div x-show="reports.length === 0 && !loading" class="text-center py-14">
                        <div class="w-12 h-12 mx-auto mb-3 rounded-xl bg-zinc-100 flex items-center justify-center text-zinc-400">
                          <i data-lucide="file-plus-2" class="w-6 h-6"></i>
                        </div>
                        <h2 class="text-[14px] font-semibold text-zinc-700">No reports yet</h2>
                        <p class="text-[12px] text-zinc-500 mt-1">Click <span class="font-medium text-zinc-700">Add a report</span> to upload your first file.</p>
                      </div>
                    </div>
                  </div>
                </div>
              </section>

              <!-- ============================================ REPORTS — VIEWER (single report + Figma-style comments) ============================================ -->
              <!-- Section-level click closes any open thread. Pins, popovers, and sidebar items
                   use @click.stop so opening one doesn't immediately close it via this bubble. -->
              <section x-show="currentModule === 'reports' && selectedReportId"
                       @click="activeCommentId && activeCommentId !== '__pending__' && closeActiveComment()"
                       class="h-full flex flex-col bg-zinc-50 relative">
                <!-- Header -->
                <div class="flex-none border-b border-zinc-200 bg-white px-5 pt-3 pb-3 flex items-center gap-3">
                  <button @click="exitReportViewer()"
                          class="p-1.5 rounded hover:bg-zinc-100 text-zinc-600 hover:text-zinc-900 flex-none"
                          title="Back to reports list">
                    <i data-lucide="arrow-left" class="w-4 h-4"></i>
                  </button>
                  <div class="min-w-0 flex-1">
                    <div class="text-[10.5px] font-medium uppercase tracking-wider text-zinc-400 flex items-center gap-1">
                      <span>Metrics</span>
                      <span class="text-zinc-300">›</span>
                      <button @click="exitReportViewer()" class="hover:text-zinc-600">Reports</button>
                    </div>
                    <h1 class="text-[16px] font-semibold tracking-tight truncate" x-text="viewerReport()?.filename || ''"></h1>
                  </div>
                  <button @click="toggleCommentMode()"
                          :disabled="!viewerReport() || !isHtmlReport(viewerReport())"
                          :title="isHtmlReport(viewerReport()) ? '' : 'Comments are only available for HTML reports in this version'"
                          :class="[
                            commentMode ? 'bg-lime-400 hover:bg-lime-500 text-zinc-900' : 'bg-white hover:bg-zinc-50 text-zinc-700 border border-zinc-200',
                            (!viewerReport() || !isHtmlReport(viewerReport())) ? 'opacity-40 cursor-not-allowed' : ''
                          ]"
                          class="text-[12px] font-semibold px-3 py-1.5 rounded-md flex items-center gap-1.5 transition">
                    <i data-lucide="message-square-plus" class="w-3.5 h-3.5"></i>
                    <span x-text="commentMode ? 'Cancel' : 'Comment'"></span>
                  </button>
                  <button @click="viewerReport() && downloadReportSignedUrl(viewerReport())"
                          class="text-[12px] font-semibold px-3 py-1.5 rounded-md flex items-center gap-1.5 bg-white hover:bg-zinc-50 text-zinc-700 border border-zinc-200">
                    <i data-lucide="download" class="w-3.5 h-3.5"></i>
                    Download
                  </button>
                  <button @click="toggleCommentsSidebar()"
                          :class="commentsSidebarOpen ? 'bg-zinc-100 text-zinc-900' : 'bg-white text-zinc-600 hover:bg-zinc-50 hover:text-zinc-900'"
                          class="ml-1 p-1.5 rounded-md border border-zinc-200 flex items-center"
                          :title="commentsSidebarOpen ? 'Hide comments panel' : 'Show comments panel'">
                    <i :data-lucide="commentsSidebarOpen ? 'panel-right-close' : 'panel-right-open'" class="w-4 h-4"></i>
                  </button>
                </div>

                <!-- First-visit nudge: discrete tooltip pointing to the Comment button.
                     Auto-dismisses on first toggleCommentMode or manual close. -->
                <div x-show="viewerHintVisible && viewerReport() && isHtmlReport(viewerReport())"
                     class="absolute z-30 top-[58px] right-[260px] bg-zinc-900 text-white text-[12px] rounded-lg px-3 py-2.5 shadow-lg flex items-start gap-2 max-w-[260px]"
                     x-transition.opacity>
                  <i data-lucide="lightbulb" class="w-4 h-4 mt-0.5 text-amber-300 flex-none"></i>
                  <div class="flex-1">
                    <div class="font-semibold mb-0.5">Drop a comment anywhere</div>
                    <div class="text-zinc-300 leading-snug">Press <kbd class="bg-zinc-700 text-white rounded px-1 font-mono text-[10.5px]">C</kbd> or click <span class="font-semibold text-white">Comment</span>, then click on the report.</div>
                  </div>
                  <button @click="dismissViewerHint()" class="text-zinc-400 hover:text-white p-0.5 flex-none">
                    <i data-lucide="x" class="w-3.5 h-3.5"></i>
                  </button>
                  <span class="absolute -top-1.5 right-[42px] w-3 h-3 bg-zinc-900 rotate-45"></span>
                </div>

                <!-- Body: iframe + comment overlay + sidebar -->
                <div class="flex-1 flex min-h-0">
                  <div class="flex-1 relative min-w-0">
                    <!-- Loading state -->
                    <div x-show="viewerLoading" class="absolute inset-0 flex items-center justify-center text-[12px] text-zinc-500">
                      <i data-lucide="loader-2" class="w-4 h-4 mr-2 animate-spin"></i>
                      Loading report…
                    </div>
                    <!-- Error state -->
                    <div x-show="viewerError" class="absolute inset-0 flex items-center justify-center px-8">
                      <div class="text-center max-w-md">
                        <div class="w-12 h-12 mx-auto mb-3 rounded-xl bg-red-50 flex items-center justify-center text-red-600">
                          <i data-lucide="alert-triangle" class="w-6 h-6"></i>
                        </div>
                        <div class="text-[13px] font-medium text-zinc-800 mb-1">Couldn't open this report</div>
                        <p class="text-[12px] text-red-600" x-text="viewerError"></p>
                      </div>
                    </div>
                    <!-- Iframe: HTML reports (with bridge) -->
                    <template x-if="!viewerLoading && !viewerError && viewerHtmlSrcdoc">
                      <iframe id="report-viewer-iframe"
                              :srcdoc="viewerHtmlSrcdoc"
                              sandbox="allow-scripts"
                              class="absolute inset-0 w-full h-full border-0 bg-white"></iframe>
                    </template>
                    <!-- Iframe: non-HTML inline (PDF/image/text) — signed URL, no bridge -->
                    <template x-if="!viewerLoading && !viewerError && !viewerHtmlSrcdoc && viewerSignedUrl && isInlinePreviewableReport(viewerReport())">
                      <iframe :src="viewerSignedUrl"
                              class="absolute inset-0 w-full h-full border-0 bg-white"></iframe>
                    </template>
                    <!-- Unrenderable file: download fallback -->
                    <template x-if="!viewerLoading && !viewerError && viewerSignedUrl && viewerReport() && !isInlinePreviewableReport(viewerReport())">
                      <div class="absolute inset-0 flex items-center justify-center px-8">
                        <div class="text-center max-w-md">
                          <div class="w-12 h-12 mx-auto mb-3 rounded-xl bg-zinc-100 flex items-center justify-center text-zinc-400">
                            <i data-lucide="file-x-2" class="w-6 h-6"></i>
                          </div>
                          <div class="text-[14px] font-semibold text-zinc-700 mb-1">Cannot preview this file type</div>
                          <p class="text-[12px] text-zinc-500 mb-4">Inline preview is not supported for <span x-text="viewerReport()?.mimeType || 'this file'"></span>. You can still download the report.</p>
                          <button @click="downloadReportSignedUrl(viewerReport())"
                                  class="text-[12.5px] font-semibold px-3.5 py-2 rounded-md bg-lime-400 hover:bg-lime-500 text-zinc-900 inline-flex items-center gap-1.5">
                            <i data-lucide="download" class="w-4 h-4"></i>
                            Download report
                          </button>
                        </div>
                      </div>
                    </template>

                    <!-- Comment overlay: only on top of the iframe area for HTML reports.
                         pointer-events-none lets clicks pass through to the iframe normally;
                         pins themselves opt back in via .comment-pin. When commentMode is on,
                         the *iframe* handles clicks via the bridge script — the overlay stays
                         non-interactive so we don't intercept events twice. -->
                    <div x-show="viewerHtmlSrcdoc"
                         class="absolute inset-0 pointer-events-none"
                         style="overflow: hidden;">
                      <!-- Existing pins -->
                      <template x-for="c in viewerThreads()" :key="c.id">
                        <button class="comment-pin"
                                :class="(c.resolved ? 'resolved' : 'open') + (activeCommentId === c.id ? ' active' : '')"
                                :style="`left: ${c.xPct}%; top: ${pinScreenY(c)}px`"
                                x-show="pinVisible(c)"
                                @click.stop="openCommentThread(c.id)"
                                x-text="threadIndex(c)"></button>
                      </template>
                      <!-- Pending pin (draft, not yet committed) -->
                      <template x-if="pendingCommentDraft">
                        <button class="comment-pin pending active"
                                :style="`left: ${pendingCommentDraft.xPct}%; top: ${pendingCommentDraft.yPx - viewerScrollY}px`"
                                @click.stop>+</button>
                      </template>

                      <!-- Popover: active comment thread OR pending draft -->
                      <template x-if="activeCommentId === '__pending__' && pendingCommentDraft">
                        <div class="comment-popover"
                             :style="`left: ${pendingCommentDraft.xPct}%; top: ${pendingCommentDraft.yPx - viewerScrollY}px; transform: ${popoverTransform({ xPct: pendingCommentDraft.xPct, yPx: pendingCommentDraft.yPx, parentCommentId: null, id: '', reportId: '', body: '', authorEmail: '', resolved: false, createdAt: '', updatedAt: '' })};`"
                             @click.stop>
                          <div class="flex items-center gap-1.5 mb-2">
                            <div :style="`background: ${commentAuthorAvatar(session?.user?.email || '').bg}; color: ${commentAuthorAvatar(session?.user?.email || '').fg}`"
                                 class="w-5 h-5 rounded-full text-[8.5px] flex items-center justify-center font-semibold flex-none"
                                 x-text="commentAuthorInitials(session?.user?.email || '')"></div>
                            <div class="text-[11px] font-semibold text-zinc-900" x-text="commentAuthorName(session?.user?.email || '') || 'You'"></div>
                          </div>
                          <textarea x-model="commentInput"
                                    @keydown.enter.exact.prevent="commitComment()"
                                    @keydown.escape.prevent="cancelPendingComment()"
                                    x-init="$nextTick(() => $el.focus())"
                                    rows="2" placeholder="Add a comment…"
                                    class="w-full text-[12px] text-zinc-900 bg-zinc-50 border border-zinc-200 rounded px-2 py-1.5 outline-none focus:border-lime-400 resize-none"></textarea>
                          <div class="flex items-center justify-end gap-1 mt-1.5">
                            <button @click="cancelPendingComment()" class="text-[11px] px-2 py-1 rounded text-zinc-600 hover:bg-zinc-100">Cancel</button>
                            <button @click="commitComment()" :disabled="!commentInput.trim()"
                                    class="text-[11px] px-2 py-1 rounded bg-lime-400 hover:bg-lime-500 disabled:opacity-50 text-zinc-900 font-semibold">Comment</button>
                          </div>
                        </div>
                      </template>

                      <template x-for="c in viewerThreads().filter(x => x.id === activeCommentId)" :key="'pop-' + c.id">
                        <div class="comment-popover"
                             :style="`left: ${c.xPct}%; top: ${pinScreenY(c)}px; transform: ${popoverTransform(c)};`"
                             @click.stop>
                          <!-- Root comment -->
                          <div class="flex items-start gap-1.5 mb-1.5">
                            <div :style="`background: ${commentAuthorAvatar(c.authorEmail).bg}; color: ${commentAuthorAvatar(c.authorEmail).fg}`"
                                 class="w-5 h-5 rounded-full text-[8.5px] flex items-center justify-center font-semibold flex-none mt-0.5"
                                 x-text="commentAuthorInitials(c.authorEmail)"></div>
                            <div class="flex-1 min-w-0">
                              <div class="flex items-center gap-1.5">
                                <span class="text-[11px] font-semibold text-zinc-900 truncate" x-text="commentAuthorName(c.authorEmail)"></span>
                                <span class="text-[9.5px] text-zinc-400" x-text="formatCommentTime(c.createdAt)"></span>
                              </div>
                              <div class="text-[11.5px] text-zinc-700 mt-0.5 leading-snug whitespace-pre-wrap" x-text="c.body"></div>
                            </div>
                          </div>
                          <!-- Replies -->
                          <template x-for="r in viewerReplies(c.id)" :key="r.id">
                            <div class="flex items-start gap-1.5 mt-1.5 pl-1.5 border-l-2 border-zinc-100">
                              <div :style="`background: ${commentAuthorAvatar(r.authorEmail).bg}; color: ${commentAuthorAvatar(r.authorEmail).fg}`"
                                   class="w-4 h-4 rounded-full text-[8px] flex items-center justify-center font-semibold flex-none mt-0.5"
                                   x-text="commentAuthorInitials(r.authorEmail)"></div>
                              <div class="flex-1 min-w-0">
                                <div class="flex items-center gap-1.5">
                                  <span class="text-[10.5px] font-semibold text-zinc-900 truncate" x-text="commentAuthorName(r.authorEmail)"></span>
                                  <span class="text-[9px] text-zinc-400" x-text="formatCommentTime(r.createdAt)"></span>
                                </div>
                                <div class="text-[11px] text-zinc-700 leading-snug whitespace-pre-wrap" x-text="r.body"></div>
                              </div>
                              <button x-show="canDeleteComment(r)" @click.stop="deleteComment(r)"
                                      class="text-[10px] text-zinc-400 hover:text-rose-600 p-0.5 rounded opacity-0 group-hover:opacity-100"
                                      title="Delete reply">
                                <i data-lucide="x" class="w-3 h-3"></i>
                              </button>
                            </div>
                          </template>
                          <!-- Reply form -->
                          <form @submit.prevent="addReply(c.id)" class="mt-2 flex items-center gap-1">
                            <input type="text" :value="replyInputs[c.id] || ''"
                                   @input="replyInputs[c.id] = $event.target.value"
                                   placeholder="Reply…"
                                   class="flex-1 text-[11px] text-zinc-900 bg-zinc-50 border border-zinc-200 rounded px-2 py-1 outline-none focus:border-lime-400" />
                            <button type="submit" :disabled="!(replyInputs[c.id] || '').trim()"
                                    class="text-[10.5px] px-2 py-1 rounded bg-zinc-900 hover:bg-zinc-800 disabled:opacity-30 text-white">Send</button>
                          </form>
                          <!-- Footer -->
                          <div class="flex items-center justify-between mt-2 pt-2 border-t border-zinc-100">
                            <button @click.stop="toggleResolveComment(c)"
                                    class="text-[10.5px] text-zinc-600 hover:text-zinc-900 flex items-center gap-1">
                              <i :data-lucide="c.resolved ? 'rotate-ccw' : 'check'" class="w-3 h-3"></i>
                              <span x-text="c.resolved ? 'Reopen' : 'Resolve'"></span>
                            </button>
                            <div class="flex items-center gap-1">
                              <button x-show="canDeleteComment(c)" @click.stop="deleteComment(c)"
                                      class="text-[10.5px] text-zinc-500 hover:text-rose-600 p-1 rounded"
                                      title="Delete thread">
                                <i data-lucide="trash-2" class="w-3 h-3"></i>
                              </button>
                              <button @click.stop="closeActiveComment()"
                                      class="text-[10.5px] text-zinc-500 hover:text-zinc-900 p-1 rounded">
                                <i data-lucide="x" class="w-3 h-3"></i>
                              </button>
                            </div>
                          </div>
                        </div>
                      </template>
                    </div>
                  </div>

                  <!-- Right sidebar: thread list. Retractable like the main sidebar; default closed. -->
                  <aside x-show="viewerHtmlSrcdoc && commentsSidebarOpen"
                         x-transition:enter="transition ease-out duration-150"
                         x-transition:enter-start="opacity-0 translate-x-2"
                         x-transition:enter-end="opacity-100 translate-x-0"
                         x-transition:leave="transition ease-in duration-100"
                         x-transition:leave-start="opacity-100 translate-x-0"
                         x-transition:leave-end="opacity-0 translate-x-2"
                         class="flex-none w-[280px] border-l border-zinc-200 bg-white flex flex-col">
                    <div class="flex-none px-3 py-2.5 border-b border-zinc-200 flex items-center justify-between">
                      <div class="text-[11.5px] font-semibold tracking-tight text-zinc-700">
                        Comments
                        <span class="text-zinc-400 font-normal" x-text="`(${viewerComments.filter(c => c.parentCommentId === null).length})`"></span>
                      </div>
                      <div class="flex items-center gap-1.5">
                        <label class="text-[10.5px] text-zinc-500 flex items-center gap-1.5 cursor-pointer">
                          <input type="checkbox" x-model="showResolvedComments" class="w-3 h-3" />
                          Show resolved
                        </label>
                        <button @click="toggleCommentsSidebar()" class="p-1 rounded hover:bg-zinc-100 text-zinc-400 hover:text-zinc-700" title="Hide panel">
                          <i data-lucide="x" class="w-3.5 h-3.5"></i>
                        </button>
                      </div>
                    </div>
                    <div class="flex-1 overflow-y-auto p-2">
                      <template x-for="c in viewerComments.filter(x => x.parentCommentId === null && (showResolvedComments || !x.resolved))" :key="'side-' + c.id">
                        <button @click.stop="openCommentThread(c.id)"
                                :class="activeCommentId === c.id ? 'bg-lime-50 border-lime-300' : 'bg-white border-zinc-200 hover:bg-zinc-50'"
                                class="w-full text-left mb-1.5 px-2 py-2 rounded border text-[11.5px] flex items-start gap-2">
                          <div class="w-5 h-5 rounded-full flex items-center justify-center font-semibold text-[10px] flex-none mt-0.5"
                               :class="c.resolved ? 'bg-zinc-200 text-zinc-500' : 'bg-lime-400 text-zinc-900'"
                               x-text="threadIndex(c)"></div>
                          <div class="flex-1 min-w-0">
                            <div class="font-medium text-zinc-900 truncate" x-text="commentAuthorName(c.authorEmail)"></div>
                            <div class="text-zinc-600 text-[11px] leading-snug line-clamp-2 mt-0.5" x-text="c.body"></div>
                            <div class="text-[9.5px] text-zinc-400 mt-0.5 flex items-center gap-2">
                              <span x-text="formatCommentTime(c.createdAt)"></span>
                              <span x-show="viewerReplies(c.id).length > 0" x-text="`· ${viewerReplies(c.id).length} ${viewerReplies(c.id).length === 1 ? 'reply' : 'replies'}`"></span>
                              <span x-show="c.resolved" class="text-zinc-400">· resolved</span>
                            </div>
                          </div>
                        </button>
                      </template>
                      <div x-show="viewerComments.filter(c => c.parentCommentId === null).length === 0" class="text-center text-[11.5px] text-zinc-400 py-8 px-4">
                        No comments yet. Click <span class="font-semibold text-zinc-600">Comment</span> in the header and drop a pin on the report.
                      </div>
                    </div>
                  </aside>
                </div>
              </section>

              <!-- ============================================ PROTOTYPES ============================================ -->
              <section x-show="currentModule === 'prototyping'" class="h-full flex flex-col">
                <div class="flex-none border-b border-zinc-200 bg-white px-5 pt-3.5 pb-3.5 flex items-center justify-between">
                  <div>
                    <h1 class="text-[18px] font-semibold tracking-tight">Prototypes</h1>
                    <p class="text-[12px] text-zinc-500">All prototypes in flight. Upload an HTML file to start iterating.</p>
                  </div>
                  <div class="flex items-center gap-2">
                    <div class="inline-flex items-center bg-zinc-100 rounded-md p-0.5">
                      <button @click="prototypingListMode = 'list'; refreshIcons()"
                              :class="prototypingListMode === 'list' ? 'bg-white text-zinc-900 shadow-sm' : 'text-zinc-500 hover:text-zinc-900'"
                              class="text-[11.5px] font-medium px-2.5 py-1 rounded flex items-center gap-1.5 transition">
                        <i data-lucide="list" class="w-3 h-3"></i>
                        List
                      </button>
                      <button @click="prototypingListMode = 'kanban'; refreshIcons()"
                              :class="prototypingListMode === 'kanban' ? 'bg-white text-zinc-900 shadow-sm' : 'text-zinc-500 hover:text-zinc-900'"
                              class="text-[11.5px] font-medium px-2.5 py-1 rounded flex items-center gap-1.5 transition">
                        <i data-lucide="kanban-square" class="w-3 h-3"></i>
                        Kanban
                      </button>
                    </div>
                    <label :class="prototypeUploading ? 'opacity-60 pointer-events-none' : 'cursor-pointer'"
                           class="text-[12px] font-semibold bg-lime-400 hover:bg-lime-500 text-zinc-900 px-3 py-1.5 rounded-md flex items-center gap-1.5">
                      <i :data-lucide="prototypeUploading ? 'loader-2' : 'upload'" :class="prototypeUploading ? 'animate-spin' : ''" class="w-3.5 h-3.5"></i>
                      <span x-text="prototypeUploading ? 'Uploading…' : 'Upload HTML'"></span>
                      <input type="file" class="sr-only" accept=".html,.htm,text/html" @change="uploadPrototype($event)" :disabled="prototypeUploading" />
                    </label>
                  </div>
                </div>

                <!-- toolbar (list mode only) -->
                <div x-show="prototypingListMode === 'list'" class="flex-none bg-white border-b border-zinc-200 px-5 py-2.5 flex items-center gap-2 flex-wrap">
                  <div class="relative">
                    <i data-lucide="search" class="w-3.5 h-3.5 text-zinc-400 absolute left-2.5 top-1/2 -translate-y-1/2"></i>
                    <input type="text" x-model="prototypeSearch" placeholder="Search by name, author, filename"
                           class="pl-7 pr-3 py-1.5 w-72 text-[12px] rounded-md bg-white border border-zinc-200 focus:outline-none focus:ring-2 focus:ring-lime-300 focus:border-lime-300 placeholder:text-zinc-400" />
                  </div>
                  <div class="flex items-center gap-1.5">
                    <label class="text-[11px] text-zinc-500 flex items-center gap-1.5">
                      <i data-lucide="arrow-up-down" class="w-3.5 h-3.5"></i>
                      Sort
                    </label>
                    <select x-model="prototypeSort" class="text-[12px] px-2 py-1.5 rounded-md border border-zinc-200 bg-white">
                      <option value="updated-desc">Recently updated</option>
                      <option value="updated-asc">Oldest first</option>
                      <option value="label-asc">Name · A → Z</option>
                      <option value="label-desc">Name · Z → A</option>
                      <option value="author-asc">Author · A → Z</option>
                    </select>
                  </div>
                  <div class="ml-auto text-[11.5px] text-zinc-500" x-text="`${filteredPrototypes().length} prototypes`"></div>
                </div>

                <!-- error -->
                <p x-show="error && currentModule === 'prototyping'" x-text="error" class="flex-none px-5 py-2 text-[12px] text-red-600 bg-red-50 border-b border-red-100"></p>

                <!-- LIST MODE -->
                <div x-show="prototypingListMode === 'list'" class="flex-1 overflow-auto p-5">
                  <div class="bg-white border border-zinc-200 rounded-lg overflow-x-auto">
                    <div class="min-w-max">
                      <div class="flex items-start gap-3 text-[10.5px] uppercase tracking-wider font-semibold text-zinc-400 px-4 py-2.5 border-b border-zinc-200 bg-zinc-50">
                        <div class="w-[420px] flex-none">Name</div>
                        <div class="w-[240px] flex-none">Author</div>
                        <div class="w-[140px] flex-none">Last edited</div>
                        <div class="w-[180px] flex-none">Status</div>
                        <div class="w-[80px]  flex-none text-right">Actions</div>
                      </div>

                      <template x-for="p in filteredPrototypes()" :key="p.id">
                        <button type="button" @click="openPrototype(p)"
                                class="w-full text-left flex items-start gap-3 px-4 py-2.5 border-b border-zinc-100 hover:bg-zinc-50 transition group cursor-pointer">
                          <div class="w-[420px] flex-none min-w-0 flex items-center gap-2.5">
                            <div class="w-8 h-10 flex-none rounded bg-gradient-to-br from-zinc-100 to-zinc-200 ring-1 ring-zinc-200 flex items-center justify-center">
                              <i data-lucide="smartphone" class="w-3.5 h-3.5 text-zinc-400"></i>
                            </div>
                            <div class="min-w-0 flex-1">
                              <div class="text-[13px] font-medium text-zinc-900 truncate group-hover:text-lime-700" x-text="`v${p.version} · ${p.label}`"></div>
                              <div class="text-[10.5px] font-mono text-zinc-400 mt-0.5 truncate" x-text="p.sourceFilename || (p.blobUrl ? 'uploaded' : 'seed · no file')"></div>
                            </div>
                          </div>
                          <div class="w-[240px] flex-none text-[12px] text-zinc-700 truncate self-center" x-text="p.author"></div>
                          <div class="w-[140px] flex-none text-[12px] text-zinc-500 self-center" x-text="formatPrototypeDate(p.updatedAt)"></div>
                          <div class="w-[180px] flex-none self-center">
                            <span class="inline-flex items-center gap-1.5 text-[10.5px] px-2 py-0.5 rounded"
                                  :class="prototypeStatusMeta(p.status).pill">
                              <span class="w-1.5 h-1.5 rounded-full" :class="prototypeStatusMeta(p.status).dot"></span>
                              <span x-text="prototypeStatusMeta(p.status).label"></span>
                            </span>
                          </div>
                          <div class="w-[80px] flex-none flex items-center justify-end gap-1 self-center">
                            <span x-show="p.blobUrl" @click.stop="openPrototype(p)"
                                  class="p-1.5 rounded hover:bg-zinc-100 text-zinc-500 hover:text-zinc-900 cursor-pointer"
                                  title="Open in new tab">
                              <i data-lucide="external-link" class="w-3.5 h-3.5"></i>
                            </span>
                            <span @click.stop="removePrototype(p)"
                                  class="p-1.5 rounded hover:bg-red-50 text-zinc-400 hover:text-red-600 cursor-pointer"
                                  title="Delete">
                              <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                            </span>
                          </div>
                        </button>
                      </template>

                      <div x-show="filteredPrototypes().length === 0 && prototypes.length > 0" class="text-[12px] text-zinc-400 text-center py-10">
                        No prototypes match the current search.
                      </div>
                      <div x-show="prototypes.length === 0" class="text-center py-14">
                        <div class="w-12 h-12 mx-auto mb-3 rounded-xl bg-zinc-100 flex items-center justify-center text-zinc-400">
                          <i data-lucide="layers" class="w-6 h-6"></i>
                        </div>
                        <h2 class="text-[14px] font-semibold text-zinc-700">No prototypes yet</h2>
                        <p class="text-[12px] text-zinc-500 mt-1">Click <span class="font-medium text-zinc-700">Upload HTML</span> to add your first one.</p>
                      </div>
                    </div>
                  </div>
                </div>

                <!-- KANBAN MODE -->
                <div x-show="prototypingListMode === 'kanban'" class="flex-1 overflow-x-auto overflow-y-hidden bg-zinc-50">
                  <div class="h-full flex gap-3 px-5 py-5 min-w-max">
                    <template x-for="col in prototypeStatuses" :key="col.key">
                      <div class="w-[280px] flex-none flex flex-col bg-white border border-zinc-200 rounded-lg overflow-hidden"
                           @dragover.prevent="kanbanHoverCol = col.key"
                           @dragleave="if (kanbanHoverCol === col.key) kanbanHoverCol = null"
                           @drop.prevent="onPrototypeDrop(col.key)"
                           :class="kanbanHoverCol === col.key ? 'ring-2 ring-lime-400 ring-offset-1' : ''">
                        <div class="flex-none px-3 py-2.5 border-b border-zinc-200 bg-zinc-50 flex items-center justify-between">
                          <div class="flex items-center gap-2 min-w-0">
                            <span class="w-1.5 h-1.5 rounded-full flex-none" :class="col.dot"></span>
                            <span class="text-[11.5px] font-semibold text-zinc-700 truncate" x-text="col.label"></span>
                          </div>
                          <span class="text-[10.5px] font-mono text-zinc-400" x-text="prototypesByStatus(col.key).length"></span>
                        </div>
                        <div class="flex-1 overflow-y-auto p-2 space-y-2 min-h-[60px]">
                          <template x-for="p in prototypesByStatus(col.key)" :key="p.id">
                            <div draggable="true"
                                 @dragstart="onPrototypeDragStart(p, $event)"
                                 @dragend="onPrototypeDragEnd()"
                                 @click="openPrototype(p)"
                                 class="cursor-pointer rounded-md border border-zinc-200 bg-white hover:border-zinc-300 hover:shadow-sm transition p-2.5 flex flex-col gap-1.5"
                                 :class="kanbanDragId === p.id ? 'opacity-40' : ''">
                              <div class="flex items-start gap-2">
                                <div class="w-7 h-9 flex-none rounded bg-gradient-to-br from-zinc-100 to-zinc-200 ring-1 ring-zinc-200 flex items-center justify-center">
                                  <i data-lucide="smartphone" class="w-3 h-3 text-zinc-400"></i>
                                </div>
                                <div class="min-w-0 flex-1">
                                  <div class="text-[12px] font-medium text-zinc-900 leading-snug truncate" x-text="`v${p.version} · ${p.label}`"></div>
                                  <div class="text-[10px] font-mono text-zinc-400 truncate mt-0.5" x-text="p.sourceFilename || ''"></div>
                                </div>
                              </div>
                              <div class="flex items-center justify-between text-[10.5px] text-zinc-500">
                                <span class="truncate" x-text="p.author"></span>
                                <span class="flex-none text-zinc-400" x-text="formatPrototypeDate(p.updatedAt)"></span>
                              </div>
                            </div>
                          </template>
                          <div x-show="prototypesByStatus(col.key).length === 0" class="text-[10.5px] text-zinc-300 text-center py-4 italic">
                            Drop a prototype here
                          </div>
                        </div>
                      </div>
                    </template>
                  </div>
                </div>
              </section>

              <!-- ============================================ SETTINGS ============================================ -->
              <section x-show="currentModule === 'settings'" class="h-full flex flex-col">
                <div class="flex-none border-b border-zinc-200 bg-white px-5 pt-3.5 pb-3.5">
                  <h1 class="text-[18px] font-semibold tracking-tight">Settings</h1>
                  <p class="text-[12px] text-zinc-500">Toggle which modules and features are available across the app. Changes apply to all users on their next refresh.</p>
                </div>
                <div class="flex-1 overflow-y-auto">
                  <div class="max-w-2xl mx-auto px-5 py-6">
                    <!-- Account / change password -->
                    <div class="mb-6 border border-zinc-200 rounded-lg p-4">
                      <h2 class="text-[14px] font-semibold text-zinc-900">Account</h2>
                      <p class="text-[12px] text-zinc-500 mb-3">Signed in as <span class="font-medium text-zinc-700" x-text="session?.user?.email"></span>. Change your password anytime.</p>
                      <form @submit.prevent="changePassword()" class="space-y-2.5 max-w-sm">
                        <input x-model="settingsNewPassword" type="password" placeholder="New password (min. 8 characters)" required
                               class="w-full border border-zinc-300 rounded-md px-3 py-2 text-[13px]" />
                        <input x-model="settingsConfirmPassword" type="password" placeholder="Confirm new password" required
                               class="w-full border border-zinc-300 rounded-md px-3 py-2 text-[13px]" />
                        <button :disabled="settingsPwBusy" class="bg-zinc-900 text-white px-4 py-2 rounded-md text-[13px] font-medium hover:bg-zinc-800 disabled:opacity-50">
                          <span x-text="settingsPwBusy ? 'Saving…' : 'Change password'"></span>
                        </button>
                        <p x-show="settingsPwError" x-text="settingsPwError" class="text-[12px] text-red-600"></p>
                        <p x-show="settingsPwMsg" x-text="settingsPwMsg" class="text-[12px] text-green-600"></p>
                      </form>
                    </div>

                    <div x-show="settingsError" class="mb-4 px-3 py-2 text-[12px] text-red-700 bg-red-50 border border-red-100 rounded">
                      <span x-text="settingsError"></span>
                    </div>

                    <div class="flex items-center gap-1 mb-4 border-b border-zinc-200">
                      <template x-for="g in settingsFlagGroups" :key="g">
                        <button @click="settingsActiveGroup = g"
                                :class="settingsActiveGroup === g ? 'border-zinc-900 text-zinc-900' : 'border-transparent text-zinc-500 hover:text-zinc-900'"
                                class="text-[13px] px-3 py-2 border-b-2 -mb-px transition">
                          <span x-text="g"></span>
                        </button>
                      </template>
                    </div>

                            <div class="flex items-center gap-2.5 px-2.5 py-2">
                              <template x-if="personById(drawerInitiative.engDri)">
                                <div class="w-9 h-9 rounded-full text-[11px] flex items-center justify-center font-semibold flex-none"
                                     :style="`background:${personById(drawerInitiative.engDri).avatarBg};color:${personById(drawerInitiative.engDri).avatarFg}`"
                                     x-text="personById(drawerInitiative.engDri).initials"></div>
                              </template>
                              <template x-if="!personById(drawerInitiative.engDri)">
                                <div class="w-9 h-9 rounded-full bg-zinc-100 text-zinc-400 flex items-center justify-center flex-none">
                                  <i data-lucide="user" class="w-4 h-4"></i>
                                </div>
                              </template>
                              <div class="flex-1 min-w-0">
                                <div class="text-[10px] uppercase tracking-wider text-zinc-400 font-semibold">Engineering DRI</div>
                                <div class="text-[12.5px] font-semibold text-zinc-900 truncate"
                                     x-text="personById(drawerInitiative.engDri)?.name || 'Unassigned'"></div>
                              </div>
                              <i data-lucide="chevron-down" class="w-4 h-4 text-zinc-400 flex-none"></i>
                            </div>
                            <select x-model="drawerInitiative.engDri"
                                    x-effect="$nextTick(() => { $el.value = drawerInitiative?.engDri ?? '' })"
                                    @change="saveInitiative(drawerInitiative)"
                                    class="absolute inset-0 w-full h-full opacity-0 cursor-pointer">
                              <option value="">Unassigned</option>
                              <template x-for="p in people" :key="p.id">
                                <option :value="p.id" x-text="`${p.name} · ${p.role}`"></option>
                              </template>
                            </select>
                          </div>
                        </div>
                      </div>

                      <!-- allocated team -->
                      <div>
                        <div class="text-[10px] uppercase tracking-wider text-zinc-400 font-semibold mb-1.5 flex items-center justify-between">
                          <span>Allocated team</span>
                          <span class="text-[10.5px] font-mono text-zinc-400 normal-case tracking-normal" x-text="`${hcsFor(drawerInitiative)} people`"></span>
                        </div>
                        <div class="flex flex-wrap gap-1.5">
                          <template x-for="p in peopleOnInitiative(drawerInitiative.id)" :key="p.id">
                            <span class="inline-flex items-center gap-1.5 text-[11.5px] bg-white border border-zinc-200 text-zinc-700 px-1.5 py-1 rounded font-medium">
                              <span class="w-5 h-5 rounded-full text-[9px] flex items-center justify-center font-semibold flex-none"
                                    :style="`background:${p.avatarBg};color:${p.avatarFg}`"
                                    x-text="p.initials"></span>
                              <span x-text="p.name"></span>
                            </span>
                          </template>
                          <div x-show="peopleOnInitiative(drawerInitiative.id).length === 0" class="text-[11.5px] text-zinc-400 italic">
                            No one allocated yet. Add this initiative to people in the People module.
                          </div>
                        </div>
                      </div>

                      <!-- countries -->
                      <div>
                        <div class="text-[10px] uppercase tracking-wider text-zinc-400 font-semibold mb-1.5 flex items-center justify-between">
                          <span>Available countries</span>
                          <div class="flex items-center gap-2">
                            <button type="button"
                                    @click="toggleAllInitiativeCountries(drawerInitiative)"
                                    class="text-[10.5px] font-semibold normal-case tracking-normal text-lime-700 hover:text-lime-800"
                                    x-text="initiativeHasAllCountries(drawerInitiative) ? 'Clear all' : 'All countries'"></button>
                            <span class="text-[10.5px] font-mono text-zinc-400 normal-case tracking-normal" x-text="`${drawerInitiative.countries.length}/${INITIATIVE_COUNTRIES.length}`"></span>
                          </div>
                        </div>
                        <div class="flex flex-wrap gap-1.5">
                          <template x-for="c in INITIATIVE_COUNTRIES" :key="c.code">
                            <button type="button"
                                    @click="toggleInitiativeCountry(drawerInitiative, c.code)"
                                    :class="drawerInitiative.countries.includes(c.code)
                                              ? 'bg-lime-50 border-lime-300 text-lime-800'
                                              : 'bg-white border-zinc-200 text-zinc-600 hover:bg-zinc-50'"
                                    class="inline-flex items-center gap-1.5 text-[11.5px] px-2 py-1 rounded font-medium border transition">
                              <span x-text="c.flag"></span>
                              <span x-text="c.label"></span>
                              <i x-show="drawerInitiative.countries.includes(c.code)" data-lucide="check" class="w-3 h-3"></i>
                            </button>
                          </template>
                        </div>
                      </div>

                      <!-- description -->
                      <div>
                        <label class="block text-[10px] uppercase tracking-wider text-zinc-400 font-semibold mb-1">Description</label>
                        <textarea x-model="drawerInitiative.description"
                                  @change="saveInitiative(drawerInitiative)"
                                  rows="4"
                                  placeholder="What this initiative is about…"
                                  class="w-full px-2.5 py-2 text-[12.5px] leading-snug rounded-md border border-zinc-200 bg-white focus:border-lime-400 focus:outline-none focus:ring-2 focus:ring-lime-300 resize-y"></textarea>
                      </div>

                    </div>
                  </div>

                  <!-- activity tab — per-initiative change history -->
                  <div class="flex-1 overflow-y-auto px-5 py-4" x-show="drawerMode === 'edit' && drawerTab === 'activity'">
                    <p x-show="drawerInitiativeAuditLoading" class="text-[12px] text-zinc-500">Loading activity…</p>
                    <p x-show="!drawerInitiativeAuditLoading && drawerInitiativeAudit.length === 0" class="text-[12px] text-zinc-400 italic">No changes recorded yet.</p>
                    <ol class="space-y-3" x-show="!drawerInitiativeAuditLoading && drawerInitiativeAudit.length">
                      <template x-for="e in drawerInitiativeAudit" :key="e.id">
                        <li class="flex items-start gap-2.5 text-[12px]">
                          <div class="mt-0.5 w-6 h-6 rounded-full flex-none flex items-center justify-center bg-zinc-100 text-zinc-500">
                            <i :data-lucide="e.action === 'create' ? 'plus' : (e.action === 'delete' ? 'trash-2' : 'pencil')" class="w-3 h-3"></i>
                          </div>
                          <div class="min-w-0 flex-1">
                            <template x-if="e.action === 'update'">
                              <div class="text-zinc-700">
                                <span class="font-medium" x-text="auditFieldLabel(e.field)"></span>:
                                <span class="text-zinc-400 line-through" x-text="auditValueDisplay(e.field, e.oldValue)"></span>
                                <i data-lucide="arrow-right" class="inline w-3 h-3 text-zinc-400 align-middle mx-0.5"></i>
                                <span class="text-zinc-900" x-text="auditValueDisplay(e.field, e.newValue)"></span>
                              </div>
                            </template>
                            <template x-if="e.action !== 'update'">
                              <div class="text-zinc-700"><span class="font-medium" x-text="e.action === 'create' ? 'Created' : 'Deleted'"></span></div>
                            </template>
                            <div class="text-[10.5px] text-zinc-400 mt-0.5">
                              <span x-text="auditActorName(e.actorEmail)"></span>
                              ·
                              <span x-text="auditTime(e.createdAt)"></span>
                              <span x-text="' · ' + e.createdAt.slice(0, 10)"></span>
                            </div>
                          </div>
                        </li>
                      </template>
                    </ol>
                  </div>

                  <!-- footer -->
                  <div class="flex-none px-5 py-3 border-t border-zinc-100 flex items-center gap-2">
                    <div class="text-[11px] text-zinc-400 flex items-center gap-1.5">
                      <template x-if="drawerMode === 'edit'">
                        <span class="flex items-center gap-1.5">
                          <i data-lucide="check-circle-2" class="w-3.5 h-3.5 text-lime-500"></i>
                          <span>Changes saved automatically</span>
                        </span>
                      </template>
                      <template x-if="drawerMode === 'create'">
                        <span class="flex items-center gap-1.5">
                          <i data-lucide="circle-dashed" class="w-3.5 h-3.5 text-zinc-400"></i>
                          <span>Draft — click Create to save</span>
                        </span>
                      </template>
                    </div>
                    <div class="flex-1"></div>

                    <!-- ===== edit-mode actions ===== -->
                    <!-- restore (when archived or deleted) -->
                    <button x-show="drawerMode === 'edit' && drawerInitiative.initiativeStatus !== 'active'"
                            @click="setInitiativeStatus(drawerInitiative.id, 'active')"
                            class="text-[12px] font-medium px-2.5 py-2 rounded-md border border-zinc-200 bg-white hover:bg-zinc-50 text-zinc-700 flex items-center gap-1.5">
                      <i data-lucide="rotate-ccw" class="w-3.5 h-3.5"></i>
                      <span>Restore</span>
                    </button>

                    <!-- archive (when active) -->
                    <button x-show="drawerMode === 'edit' && drawerInitiative.initiativeStatus === 'active'"
                            @click="setInitiativeStatus(drawerInitiative.id, 'archived')"
                            class="text-[12px] font-medium px-2.5 py-2 rounded-md border border-amber-200 bg-amber-50 hover:bg-amber-100 text-amber-800 flex items-center gap-1.5">
                      <i data-lucide="archive" class="w-3.5 h-3.5"></i>
                      <span>Archive</span>
                    </button>

                    <!-- delete (when not already deleted) -->
                    <button x-show="drawerMode === 'edit' && drawerInitiative.initiativeStatus !== 'deleted'"
                            @click="confirm(`Delete “${drawerInitiative.name}”? It will be hidden from default views but you can restore it later via the filter.`) && setInitiativeStatus(drawerInitiative.id, 'deleted')"
                            class="text-[12px] font-medium px-2.5 py-2 rounded-md border border-red-200 bg-red-50 hover:bg-red-100 text-red-700 flex items-center gap-1.5">
                      <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                      <span>Delete</span>
                    </button>

                    <!-- ===== create-mode action ===== -->
                    <button x-show="drawerMode === 'create'"
                            @click="submitNewInitiative()"
                            class="text-[12px] font-semibold px-3 py-2 rounded-md bg-lime-400 hover:bg-lime-500 text-zinc-900 flex items-center gap-1.5">
                      <i data-lucide="plus" class="w-3.5 h-3.5"></i>
                      <span>Create</span>
                    </button>
                  </div>

                </div>
              </template>
            </div>
          </div>

          <!-- ============================================ PERSON DRAWER ============================================ -->
          <div x-show="personDrawerOpen" x-transition.opacity class="fixed inset-0 z-40" @click.self="closePersonDrawer()" @keydown.escape.window="personDrawerOpen && closePersonDrawer()" style="background:rgba(15,15,17,0.35)">
            <div x-show="personDrawerOpen"
                 x-transition:enter="transition ease-out duration-250"
                 x-transition:enter-start="translate-x-full"
                 x-transition:enter-end="translate-x-0"
                 x-transition:leave="transition ease-in duration-200"
                 x-transition:leave-start="translate-x-0"
                 x-transition:leave-end="translate-x-full"
                 class="absolute inset-y-0 right-0 w-[480px] bg-white shadow-2xl flex flex-col"
                 style="box-shadow:-16px 0 48px -12px rgba(0,0,0,0.18)">

              <template x-if="personDrawerPerson">
                <div class="flex flex-col h-full">

                  <!-- header -->
                  <div class="flex-none px-5 pt-5 pb-4 border-b border-zinc-100">
                    <div class="flex items-start justify-between mb-4">
                      <div class="flex items-center gap-3 min-w-0">
                        <div class="w-12 h-12 rounded-full text-[15px] flex items-center justify-center font-semibold flex-none"
                             :style="`background:${personDrawerPerson.avatarBg};color:${personDrawerPerson.avatarFg}`"
                             x-text="personDrawerPerson.initials"></div>
                        <div class="min-w-0">
                          <div class="text-[10px] font-mono text-zinc-400" x-text="personDrawerPerson.id.slice(0, 8)"></div>
                          <div class="text-[18px] font-semibold tracking-tight text-zinc-900 truncate" x-text="personDrawerPerson.name"></div>
                        </div>
                      </div>
                      <button @click="closePersonDrawer()" class="p-1 rounded hover:bg-zinc-100 text-zinc-500 flex-none">
                        <i data-lucide="x" class="w-4 h-4"></i>
                      </button>
                    </div>
                  </div>

                  <!-- scrollable body -->
                  <div class="flex-1 overflow-y-auto px-5 py-4 space-y-4">

                    <!-- edit form -->
                    <div class="space-y-3.5">
                      <div>
                        <label class="block text-[10px] uppercase tracking-wider text-zinc-400 font-semibold mb-1">Name</label>
                        <input type="text"
                               x-model="personDrawerPerson.name"
                               @change="savePerson(personDrawerPerson)"
                               placeholder="Full name…"
                               class="w-full px-2.5 py-1.5 text-[12.5px] rounded-md border border-zinc-200 bg-white focus:border-lime-400 focus:outline-none focus:ring-2 focus:ring-lime-300" />
                      </div>
                      <div>
                        <label class="block text-[10px] uppercase tracking-wider text-zinc-400 font-semibold mb-1">Role</label>
                        <input type="text"
                               x-model="personDrawerPerson.role"
                               @change="savePerson(personDrawerPerson)"
                               placeholder="e.g. Product Manager"
                               class="w-full px-2.5 py-1.5 text-[12.5px] rounded-md border border-zinc-200 bg-white focus:border-lime-400 focus:outline-none focus:ring-2 focus:ring-lime-300" />
                      </div>
                      <div>
                        <label class="block text-[10px] uppercase tracking-wider text-zinc-400 font-semibold mb-1">Email</label>
                        <input type="email"
                               x-model="personDrawerPerson.email"
                               @change="savePerson(personDrawerPerson)"
                               placeholder="person@teya.com"
                               class="w-full px-2.5 py-1.5 text-[12.5px] rounded-md border border-zinc-200 bg-white focus:border-lime-400 focus:outline-none focus:ring-2 focus:ring-lime-300" />
                      </div>
                    </div>

                    <!-- allocated initiatives -->
                    <div class="pt-2">
                      <div class="flex items-center justify-between mb-2">
                        <div class="text-[10px] uppercase tracking-wider text-zinc-400 font-semibold">Allocated initiatives</div>
                        <span class="text-[10.5px] font-mono text-zinc-400 normal-case tracking-normal"
                              x-text="`${initiativesForPerson(personDrawerPerson).length} total`"></span>
                      </div>
                      <div class="space-y-1.5">
                        <template x-for="ini in initiativesForPerson(personDrawerPerson)" :key="ini.id">
                          <button @click="closePersonDrawer(); openInitiative(ini)"
                                  class="w-full flex items-center gap-2 px-2.5 py-2 rounded-md border border-zinc-200 bg-white hover:border-zinc-300 hover:bg-zinc-50 transition text-left group">
                            <span class="w-1.5 h-1.5 rounded-full flex-none" :style="`background:${initiativeGroupMeta(ini.productGroupId).color}`"></span>
                            <span class="flex-1 min-w-0 truncate text-[12.5px] text-zinc-900 group-hover:text-lime-700" x-text="ini.name"></span>
                            <template x-if="initiativeDeliveryStatusMeta(ini.deliveryStatus)">
                              <span class="inline-flex items-center gap-1 text-[10px] font-medium px-1.5 py-0.5 rounded flex-none"
                                    :style="`background:${initiativeDeliveryStatusMeta(ini.deliveryStatus).bg};color:${initiativeDeliveryStatusMeta(ini.deliveryStatus).fg}`">
                                <span class="w-1 h-1 rounded-full" :style="`background:${initiativeDeliveryStatusMeta(ini.deliveryStatus).color}`"></span>
                                <span x-text="initiativeDeliveryStatusMeta(ini.deliveryStatus).label"></span>
                              </span>
                            </template>
                          </button>
                        </template>
                        <div x-show="initiativesForPerson(personDrawerPerson).length === 0"
                             class="text-[11.5px] text-zinc-400 italic">Not assigned to any initiative yet.</div>
                      </div>
                    </div>

                  </div>

                  <!-- footer -->
                  <div class="flex-none px-5 py-3 border-t border-zinc-100 flex items-center gap-2">
                    <div class="text-[11px] text-zinc-400 flex items-center gap-1.5">
                      <i data-lucide="check-circle-2" class="w-3.5 h-3.5 text-lime-500"></i>
                      <span>Changes saved automatically</span>
                    </div>
                    <div class="flex-1"></div>
                    <button @click="closePersonDrawer()" class="text-[12px] font-semibold px-3 py-2 rounded-md bg-zinc-900 hover:bg-zinc-800 text-white">
                      Done
                    </button>
                  </div>

                </div>
              </template>
            </div>
          </div>

          <!-- LANES cover hover preview (fixed-positioned tooltip) -->
          <template x-if="lanesCoverHover">
            <div class="fixed z-50 pointer-events-none rounded-lg border border-zinc-200 bg-white shadow-2xl overflow-hidden"
                 :style="`top:${lanesCoverHover.top}px;left:${lanesCoverHover.left}px;width:280px;height:220px;`">
              <img :src="lanesCoverHover.src" :alt="lanesCoverHover.name" class="w-full h-full object-cover" />
              <div class="absolute bottom-0 left-0 right-0 px-2.5 py-1.5 bg-gradient-to-t from-black/70 to-transparent text-white text-[11px] font-medium truncate"
                   x-text="lanesCoverHover.name"></div>
            </div>
          </template>

          <!-- ============================================ FEEDBACK FAB + DRAWER (global) ============================================ -->
          <button x-show="!feedbackDrawerOpen"
                  x-transition.opacity
                  @click="openFeedback(); refreshIcons()"
                  title="Feedback (press F)"
                  class="fixed bottom-6 right-6 z-30 w-14 h-14 rounded-full bg-lime-400 hover:bg-lime-500 shadow-lg shadow-lime-500/30 flex items-center justify-center text-zinc-900 transition">
            <i data-lucide="message-circle-plus" class="w-6 h-6"></i>
          </button>

          <!-- backdrop -->
          <div x-show="feedbackDrawerOpen"
               x-transition.opacity
               class="fixed inset-0 z-40 bg-black/20"
               @click="closeFeedback()"></div>

          <!-- drawer -->
          <aside x-show="feedbackDrawerOpen"
                 x-transition:enter="transition ease-out duration-150"
                 x-transition:enter-start="opacity-0 translate-x-4"
                 x-transition:enter-end="opacity-100 translate-x-0"
                 x-transition:leave="transition ease-in duration-100"
                 x-transition:leave-start="opacity-100 translate-x-0"
                 x-transition:leave-end="opacity-0 translate-x-4"
                 @keydown.escape.window="if (feedbackDrawerOpen) closeFeedback()"
                 class="fixed top-0 right-0 bottom-0 w-[360px] z-50 bg-white border-l border-zinc-200 flex flex-col shadow-xl">

            <!-- header -->
            <div class="flex-none border-b border-zinc-200 px-5 py-4 flex items-center gap-2">
              <h2 class="text-[15px] font-semibold tracking-tight">Feedback</h2>
              <span class="text-[11px] text-zinc-500"
                    x-text="feedbackRequests.length + ' requests'"></span>
              <button @click="closeFeedback()" class="ml-auto text-zinc-400 hover:text-zinc-900">
                <i data-lucide="x" class="w-4 h-4"></i>
              </button>
            </div>

            <!-- compose toggle / form -->
            <div class="flex-none border-b border-zinc-200 px-5 py-3">
              <button x-show="!feedbackComposing"
                      @click="startFeedbackCompose(); refreshIcons()"
                      class="w-full flex items-center justify-center gap-2 px-3 py-2 rounded-md bg-zinc-900 hover:bg-zinc-800 text-white text-[12.5px] font-medium">
                <i data-lucide="plus" class="w-3.5 h-3.5"></i>
                New request
                <span class="ml-2 text-[10.5px] text-zinc-400 font-normal">press F</span>
              </button>

              <div x-show="feedbackComposing" class="space-y-2">
                <input x-model="feedbackComposeTitle"
                       x-effect="if (feedbackComposing) $nextTick(() => $el.focus())"
                       @keydown.escape.stop="cancelFeedbackCompose()"
                       @keydown.meta.enter.prevent="submitFeedback()"
                       placeholder="What's the request?"
                       class="w-full text-[13px] border border-zinc-200 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-lime-400" />
                <textarea x-model="feedbackComposeBody"
                          placeholder="(optional context)"
                          rows="3"
                          class="w-full text-[12.5px] border border-zinc-200 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-lime-400 resize-none"></textarea>
                <div class="flex gap-2 justify-end items-center">
                  <span class="text-[10.5px] text-zinc-400 mr-auto">⌘ + Enter to submit</span>
                  <button @click="cancelFeedbackCompose()"
                          class="text-[12px] text-zinc-500 hover:text-zinc-900 px-3 py-1.5">Cancel</button>
                  <button @click="submitFeedback()"
                          :disabled="!feedbackComposeTitle.trim()"
                          :class="feedbackComposeTitle.trim() ? 'bg-lime-400 hover:bg-lime-500 text-zinc-900' : 'bg-zinc-100 text-zinc-400 cursor-not-allowed'"
                          class="text-[12px] font-semibold px-3 py-1.5 rounded-md">Submit</button>
                </div>
              </div>
            </div>

            <!-- requests list (sorted by upvotes desc) -->
            <div class="flex-1 overflow-y-auto px-4 py-3 space-y-2">
              <template x-for="req in sortedFeedbackRequests()" :key="req.id">
                <div class="rounded-lg border border-zinc-200 p-3 flex gap-3 hover:border-zinc-300 transition">
                  <!-- upvote pill -->
                  <button @click.stop="toggleFeedbackUpvote(req.id)"
                          :class="req.upvotedByMe ? 'border-lime-400 bg-lime-50 text-lime-800' : 'border-zinc-200 text-zinc-600 hover:border-zinc-300'"
                          class="flex-none w-10 flex flex-col items-center justify-center py-1.5 rounded border text-[11px] font-semibold transition">
                    <i data-lucide="chevron-up" class="w-3.5 h-3.5"></i>
                    <span x-text="req.upvotes"></span>
                  </button>
                  <!-- body -->
                  <div class="flex-1 min-w-0">
                    <div class="flex items-center gap-2 mb-1">
                      <span class="text-[10px] uppercase tracking-wider font-semibold px-1.5 py-0.5 rounded"
                            :class="feedbackStatusMeta(req.status).bg + ' ' + feedbackStatusMeta(req.status).fg"
                            x-text="feedbackStatusMeta(req.status).label"></span>
                      <span class="text-[10.5px] text-zinc-400" x-text="req.authorName"></span>
                    </div>
                    <p class="text-[13px] font-medium text-zinc-900 leading-snug" x-text="req.title"></p>
                    <p x-show="req.body"
                       class="text-[12px] text-zinc-600 leading-snug mt-0.5 line-clamp-2"
                       x-text="req.body"></p>
                  </div>
                </div>
              </template>

              <div x-show="feedbackRequests.length === 0"
                   class="text-center text-[12px] text-zinc-500 py-8">
                No feedback yet. Be the first to add a request.
              </div>
            </div>
          </aside>
        </div>
      </template>
    </div>

    <script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
  </body>
</html>
