<!doctype html>
<html>
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<style>
  *{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,Figtree,system-ui,sans-serif}
  body{background:#fafafa;color:#18181b;font-size:11px}
  .layout{display:grid;grid-template-columns:54px 1fr;min-height:100vh}
  .side{background:#0a0a0a;color:#a1a1aa;padding:12px 0;display:flex;flex-direction:column;align-items:center;gap:14px}
  .side .b{color:#84cc16;font-weight:700;font-size:13px;letter-spacing:.5px}
  .side .ic{width:30px;height:30px;border-radius:8px;background:#18181b;display:flex;align-items:center;justify-content:center;font-size:13px}
  .side .ic.act{background:#84cc16;color:#0a0a0a}
  .main{display:flex;flex-direction:column}
  .top{padding:10px 14px;border-bottom:1px solid #e4e4e7;background:#fff;display:flex;justify-content:space-between;align-items:center}
  .top h1{font-size:13px;font-weight:600}
  .top .sub{font-size:10px;color:#a1a1aa;margin-top:1px}
  .pill{font-size:9.5px;padding:3px 7px;border-radius:99px;background:#ecfccb;color:#3f6212;font-weight:600}
  .body{padding:12px 14px;display:flex;flex-direction:column;gap:10px;flex:1}
  .kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .kpi{background:#fff;border:1px solid #e4e4e7;border-radius:10px;padding:10px}
  .kpi .l{font-size:9.5px;color:#a1a1aa;text-transform:uppercase;letter-spacing:1px}
  .kpi .v{font-size:16px;font-weight:700;margin-top:3px}
  .kpi .d{font-size:10px;color:#65a30d;margin-top:1px}
  .chart{background:#fff;border:1px solid #e4e4e7;border-radius:10px;padding:10px 10px 6px;height:130px;display:flex;flex-direction:column}
  .chart .l{font-size:10px;font-weight:600;margin-bottom:6px}
  .bars{flex:1;display:flex;align-items:flex-end;gap:5px}
  .bar{flex:1;background:linear-gradient(180deg,#bef264,#84cc16);border-radius:3px 3px 0 0}
  .tbl{background:#fff;border:1px solid #e4e4e7;border-radius:10px;overflow:hidden}
  .th,.tr{display:grid;grid-template-columns:1.4fr 1fr .8fr .8fr;padding:7px 10px;font-size:10.5px}
  .th{background:#f4f4f5;color:#71717a;font-weight:600;text-transform:uppercase;letter-spacing:.6px;font-size:9.5px}
  .tr{border-top:1px solid #f4f4f5}
</style>
</head>
<body>
  <div class="layout">
    <div class="side">
      <div class="b">t.</div>
      <div class="ic act">⌂</div>
      <div class="ic">↻</div>
      <div class="ic">⊞</div>
      <div class="ic">⚙</div>
    </div>
    <div class="main">
      <div class="top">
        <div><h1>Dashboard</h1><div class="sub">Café Lumière · UK · last 30d</div></div>
        <div class="pill">Live</div>
      </div>
      <div class="body">
        <div class="kpis">
          <div class="kpi"><div class="l">Revenue</div><div class="v">£38,412</div><div class="d">+8.4%</div></div>
          <div class="kpi"><div class="l">Transactions</div><div class="v">2,184</div><div class="d">+5.1%</div></div>
          <div class="kpi"><div class="l">Avg. ticket</div><div class="v">£17.59</div><div class="d">+3.1%</div></div>
        </div>
        <div class="chart">
          <div class="l">Revenue by day</div>
          <div class="bars">
            <div class="bar" style="height:42%"></div><div class="bar" style="height:55%"></div>
            <div class="bar" style="height:68%"></div><div class="bar" style="height:51%"></div>
            <div class="bar" style="height:73%"></div><div class="bar" style="height:88%"></div>
            <div class="bar" style="height:62%"></div><div class="bar" style="height:79%"></div>
            <div class="bar" style="height:91%"></div><div class="bar" style="height:74%"></div>
            <div class="bar" style="height:65%"></div><div class="bar" style="height:82%"></div>
          </div>
        </div>
        <div class="tbl">
          <div class="th"><div>Channel</div><div>Volume</div><div>Share</div><div>Δ</div></div>
          <div class="tr"><div>In person</div><div>£28,104</div><div>73%</div><div>+6%</div></div>
          <div class="tr"><div>Online</div><div>£8,210</div><div>21%</div><div>+18%</div></div>
          <div class="tr"><div>Manual</div><div>£2,098</div><div>6%</div><div>−2%</div></div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
