<!doctype html>
<html>
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<style>
  *{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,Figtree,system-ui,sans-serif}
  body{background:#fafafa;color:#18181b;min-height:100vh}
  .nav{padding:14px 16px;display:flex;justify-content:space-between;align-items:center}
  .brand{font-weight:700;color:#84cc16;font-size:14px;letter-spacing:.5px}
  .avatar{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,#84cc16,#365314);color:#fff;font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:center}
  .greet{padding:4px 16px 12px}
  .greet h1{font-size:18px;font-weight:600}
  .greet p{font-size:11.5px;color:#71717a;margin-top:2px}
  .card{margin:0 16px 12px;padding:16px;border-radius:14px;background:#18181b;color:#fafafa}
  .card .lbl{font-size:10.5px;color:#a1a1aa;text-transform:uppercase;letter-spacing:1px}
  .card .val{font-size:26px;font-weight:700;margin-top:4px}
  .card .delta{font-size:11px;color:#84cc16;margin-top:2px}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:0 16px;margin-bottom:16px}
  .tile{background:#fff;border:1px solid #e4e4e7;border-radius:12px;padding:10px 6px;text-align:center;font-size:10.5px;color:#3f3f46}
  .tile .ico{width:26px;height:26px;background:#f4f4f5;border-radius:8px;margin:0 auto 5px;display:flex;align-items:center;justify-content:center;font-size:13px;color:#52525b}
  .sec{padding:0 16px;font-size:11px;text-transform:uppercase;letter-spacing:1px;color:#71717a;margin-bottom:6px}
  .tx{margin:0 16px 8px;background:#fff;border:1px solid #e4e4e7;border-radius:12px;padding:12px;display:flex;justify-content:space-between;align-items:center}
  .tx .ttl{font-size:13px;font-weight:600}
  .tx .sub{font-size:10.5px;color:#a1a1aa;margin-top:2px}
  .tx .amt{font-size:13px;font-weight:600}
  .tx .amt.neg{color:#dc2626}
</style>
</head>
<body>
  <div class="nav"><div class="brand">teya</div><div class="avatar">ML</div></div>
  <div class="greet"><h1>Hi, Marta</h1><p>Café Lumière · UK</p></div>
  <div class="card">
    <div class="lbl">Today's takings</div>
    <div class="val">£1,284.20</div>
    <div class="delta">+12% vs. last Tue</div>
  </div>
  <div class="grid">
    <div class="tile"><div class="ico">↗</div>Send</div>
    <div class="tile"><div class="ico">↘</div>Receive</div>
    <div class="tile"><div class="ico">⊕</div>Top up</div>
    <div class="tile"><div class="ico">≡</div>More</div>
  </div>
  <div class="sec">Recent</div>
  <div class="tx"><div><div class="ttl">Card · Visa ••42</div><div class="sub">2 min ago · in person</div></div><div class="amt">+£24.00</div></div>
  <div class="tx"><div><div class="ttl">Card · Mastercard ••07</div><div class="sub">14 min ago · in person</div></div><div class="amt">+£8.50</div></div>
  <div class="tx"><div><div class="ttl">Refund · Visa ••18</div><div class="sub">1 h ago · refunded</div></div><div class="amt neg">−£12.00</div></div>
</body>
</html>
